function renderGenetica(el){
  const icoGen = {ross308:'i-chicken', aaplus:'i-chicken', cobb500:'i-chicken', hubbard:'i-chicken', criollo:'i-chicken', nrc1994:'i-book', personal:'i-scale'};
  const estiloGen = {aaplus:'--pl:#fbf3e3;--wg:#efe0c4', cobb500:'--pl:#fffdf7;--wg:#ece5d6', hubbard:'--pl:#fff6ea;--wg:#f0dcc0', criollo:'--pl:#c98a55;--wg:#a9693a;--tl:#6b3f22;--st:#8a5a33'};
  el.innerHTML = `${cabecera('genetica',T('La línea genética define la velocidad de crecimiento y, con ella, la concentración de nutrientes que debe tener el alimento. Cada casa genética publica sus especificaciones; para otras aves puedes capturar tus propios valores.','The genetic line sets the growth rate and, with it, the nutrient density the feed must have. Each breeding company publishes its specifications; for other birds you can enter your own values.'))}
  ${teoriaDe(['fuentes','genetica'])}
  <div class="card">
    <h3>${T('Línea genética','Genetic line')}${ayuda('linea')}</h3>
    <div class="opts">${Object.entries(GENETICAS).map(([k,g])=>`
      <label class="opt ${S.genetica===k?'sel':''}"><input type="radio" name="gen" value="${k}" ${S.genetica===k?'checked':''}>
      ${ill(icoGen[k],'oico',estiloGen[k]||'')}
      <b>${esc(tx(g.nombre))}</b><small>${esc(tx(g.empresa))} · ${esc(tx(g.tipo))} · ${T('AA','AA')} ${g.base==='dig'?T('digestibles','digestible'):T('totales','total')}</small>
      <small style="margin-top:4px;clear:both">${esc(tx(g.desc))}</small><div class="badge ${ESTADO_FUENTE[g.estado][0]}">${esc(tx(ESTADO_FUENTE[g.estado][1]))}</div></label>`).join('')}
    </div>
  </div>
  <div class="card">
    <h3>${T('Sexo de las aves','Sex of the birds')}${ayuda('sexo')}</h3>
    <div class="opts">${Object.entries(SEXOS).map(([k,x])=>`
      <label class="opt ${S.sexo===k?'sel':''}"><input type="radio" name="sexo" value="${k}" ${S.sexo===k?'checked':''}>
      ${ill(k==='mixto'?'i-chick':'i-chicken','oico',k==='hembras'?'--pl:#c98a55;--wg:#a9693a;--tl:#8a5a33;--st:#8a5a33':(k==='machos'?'--tl:#2f5d50':''))}
      <b>${esc(tx(x.n))}</b><small>${esc(tx(x.d))}</small></label>`).join('')}
    </div>
  </div>
  <div class="alert ${GENETICAS[S.genetica].estado==='oficial'?'info':'warn'}"><b>${T('Fuente de los requerimientos:','Source of the requirements:')}</b> ${esc(tx(GENETICAS[S.genetica].fuente))}
   ${S.genetica==='personal'?`<p>${T('Captura tus valores en el Bloque 2. Se guardan como tu perfil para las tres fases.','Enter your values in Block 2. They are saved as your profile for the three phases.')}</p>`:''}</div>
  ${siguiente('genetica')}`;
  $$('input[name=gen]',el).forEach(r=>r.addEventListener('change',()=>{ S.genetica=r.value; S.fase=0; cargarRequerimientos(S); S.programa=null; guardar(); render(); toast(tx(GENETICAS[r.value].nombre)); }));
  $$('input[name=sexo]',el).forEach(r=>r.addEventListener('change',()=>{ S.sexo=r.value; cargarRequerimientos(S); S.programa=null; guardar(); render(); }));
}

/* ================= BLOQUE 2 · ETAPA ================= */
function renderEtapa(el){
  const g = GENETICAS[S.genetica], lista = fasesDe(S.genetica);
  const filas = NUTRIENTES.map(nu=>{
    const r = S.req[nu.k]||[null,null];
    return `<tr class="${KEYN.includes(nu.k)?'':'sci'}"><td>${esc(tx(nu.n))}${nu.aa?` <span class="muted tiny">(${g.base==='dig'?T('dig.','dig.'):'total'})</span>`:''}${ayuda(nu.k)}</td><td class="muted">${nu.u}</td>
      <td class="r"><input class="num" data-req="${nu.k}" data-l="0" value="${r[0]??''}" placeholder="—" aria-label="min ${esc(tx(nu.n))}"></td>
      <td class="r"><input class="num" data-req="${nu.k}" data-l="1" value="${r[1]??''}" placeholder="—" aria-label="max ${esc(tx(nu.n))}"></td>
      <td class="r muted sci">${nu.aa && r[0] && S.req.Lys[0] ? fmt(100*r[0]/S.req.Lys[0],0) : ''}</td></tr>`;
  }).join('');
  el.innerHTML = `${cabecera('etapa',T('Los programas de alimentación dividen la vida del pollo en fases. Conforme el ave crece baja su necesidad de proteína y aminoácidos por kg de alimento y sube la de energía.','Feeding programs split the broiler’s life into phases. As the bird grows, its need for protein and amino acids per kg of feed falls and its need for energy rises.'))}
  ${teoriaDe(['energia','proteina','minerales'])}
  <div class="card">
    <div class="row between"><h3 style="margin:0">${T('Fase de alimentación','Feeding phase')} · ${esc(tx(g.nombre))}</h3>${badgeFuente(S.genetica)}</div>
    <div class="opts" style="margin-top:12px">${lista.map((f,i)=>{ const q = S.genetica==='personal'? f.req : reqDesdeFase(g,f); return `
      <label class="opt ${S.fase===i?'sel':''}"><input type="radio" name="fase" value="${i}" ${S.fase===i?'checked':''}>
      ${ill(i===0?'i-chick':'i-chicken','oico',`transform:scale(${(0.72+0.1*i).toFixed(2)})`)}
      <b>${esc(tx(f.nombre))}</b><small>${esc(tx(f.dias))} · EM ${fmt(q.EM[0],0)} kcal · ${T('Lis','Lys')} ${fmt(q.Lys[0],2)} %</small></label>`; }).join('')}
    </div>
  </div>
  <div class="card">
    <h3>${T('Desempeño esperado en la fase','Expected performance in the phase')} <span class="muted small">(${T('para el costo por ave; edítalo con tus registros','used for cost per bird; edit it with your records')})</span></h3>
    <div class="grid g3">
      <label class="f"><span>${T('Consumo de alimento por ave (kg)','Feed intake per bird (kg)')}${ayuda('consumo')}</span><input id="consumo" value="${S.consumo??''}" inputmode="decimal"></label>
      <label class="f"><span>${T('Ganancia de peso por ave (kg)','Weight gain per bird (kg)')}${ayuda('ganancia')}</span><input id="ganancia" value="${S.ganancia??''}" inputmode="decimal"></label>
      <label class="f"><span>${T('Conversión alimenticia esperada','Expected feed conversion ratio')}${ayuda('fcr')}</span><input disabled id="ca" value="${S.consumo&&S.ganancia?fmt(S.consumo/S.ganancia,2):'—'}"></label>
    </div>
  </div>
  <div class="card">
    <div class="row between" style="margin-bottom:8px">
      <h3 style="margin:0">${T('Requerimientos nutricionales','Nutrient requirements')} ${S.reqEditado?`<span class="badge warn">${T('editados','edited')}</span>`:`<span class="badge pri">${T('según tabla','as per table')}</span>`}</h3>
      <button class="btn ghost sm" id="restaurar">↺ ${T('Restaurar valores de la tabla','Restore table values')}</button>
    </div>
    <p class="small muted" style="margin-top:0">${T('Deja la casilla vacía para no restringir.','Leave a cell empty for no constraint.')} ${T('Sexo','Sex')}: <b>${esc(tx(SEXOS[S.sexo].n))}</b>. ${T('La última columna es el perfil de <b>proteína ideal</b>: cada aminoácido como % de la lisina.','The last column is the <b>ideal-protein</b> profile: each amino acid as a % of lysine.')}${S.genetica==='personal'?' <b>'+T('Perfil personalizado:','Custom profile:')+'</b> '+T('lo que captures aquí se guarda para esta fase.','whatever you enter here is saved for this phase.'):''}</p>
    <p class="small prod" style="margin-top:0">${T('Vista productor: se muestran los 8 nutrientes clave. Los 20 nutrientes se siguen respetando al formular; para verlos y editarlos todos usa la vista científica.','Producer view: the 8 key nutrients are shown. All 20 nutrients are still enforced when formulating; switch to the scientist view to see and edit them all.')}</p>
    <div class="tbl"><table>
      <thead><tr><th>${T('Nutriente','Nutrient')}</th><th>${T('Unidad','Unit')}</th><th class="r">${T('Mínimo','Minimum')}${ayuda('minmax')}</th><th class="r">${T('Máximo','Maximum')}</th><th class="r sci">% ${T('de Lis','of Lys')}${ayuda('ideal')}</th></tr></thead>
      <tbody>${filas}</tbody></table></div>
  </div>
  ${siguiente('etapa')}`;
  $$('input[name=fase]',el).forEach(r=>r.addEventListener('change',()=>{ S.fase=+r.value; cargarRequerimientos(S); guardar(); render(); }));
  $$('[data-req]',el).forEach(i=>i.addEventListener('change',()=>{
    S.req[i.dataset.req][+i.dataset.l]=num(i.value); S.reqEditado=true; S.resultado=null;
    if(S.genetica==='personal') S.personal[S.fase].req = JSON.parse(JSON.stringify(S.req));
    guardar(); }));
  const upd = ()=>{ S.consumo=num($('#consumo').value); S.ganancia=num($('#ganancia').value); $('#ca').value = S.consumo&&S.ganancia?fmt(S.consumo/S.ganancia,2):'—';
    if(S.genetica==='personal'){ S.personal[S.fase].consumo=S.consumo; S.personal[S.fase].ganancia=S.ganancia; } guardar(); };
  $('#consumo').addEventListener('input',upd); $('#ganancia').addEventListener('input',upd);
  $('#restaurar').addEventListener('click',()=>{ cargarRequerimientos(S); guardar(); render(); toast(T('Valores de la tabla restaurados','Table values restored')); });
}

/* ================= BLOQUE 3 · CONDICIONES ================= */
function renderCondiciones(el){
  const c = S.cond, rec = [];
  if(c.altitud>=1500) rec.push({t:'warn', h:T(`Altitud de ${fmt(c.altitud,0)} msnm: riesgo de síndrome ascítico`,`Altitude of ${fmt(c.altitud,0)} m a.s.l.: risk of ascites syndrome`), p:T('La menor presión de oxígeno aumenta el trabajo del corazón en aves de crecimiento rápido. Estrategias: restricción alimenticia o de luz entre 7 y 21 d, moderar la densidad energética en iniciación y crecimiento, buena ventilación, vitaminas C y E.','Lower oxygen pressure increases the heart’s workload in fast-growing birds. Strategies: feed or light restriction between days 7 and 21, moderate energy density in starter and grower, good ventilation, vitamins C and E.'), btn:'altitud', bl:T('Reducir 50 kcal la EM de esta fase','Lower this phase’s ME by 50 kcal')});
  if(c.temp>=30) rec.push({t:'warn', h:T(`Temperatura media de ${c.temp} °C: estrés por calor`,`Mean temperature of ${c.temp} °C: heat stress`), p:T('Las aves comen menos. Conviene aumentar la densidad de nutrientes, preferir grasa sobre carbohidratos (menor calor metabólico), no exceder proteína (usar aminoácidos sintéticos), balance electrolítico ≈250 mEq/kg y bicarbonato de sodio en lugar de parte de la sal.','Birds eat less. Increase nutrient density, prefer fat over carbohydrates (less metabolic heat), avoid excess protein (use synthetic amino acids), aim for an electrolyte balance of ≈250 mEq/kg and replace part of the salt with sodium bicarbonate.'), btn:'calor', bl:T('Aplicar balance electrolítico de 230–300 mEq/kg','Apply an electrolyte balance of 230–300 mEq/kg')});
  else if(c.temp<=18) rec.push({t:'info', h:T(`Temperatura media de ${c.temp} °C: ambiente frío`,`Mean temperature of ${c.temp} °C: cold environment`), p:T('El ave gasta más energía en mantener su temperatura y come más. Revisa la calefacción; se puede mantener o subir ligeramente la energía.','Birds spend more energy keeping warm and eat more. Check the heating; energy can be kept or raised slightly.')});
  if(c.pigmentado) rec.push({t:'info', h:T('Pollo pigmentado (mercado amarillo)','Pigmented broiler (yellow-skin market)'), p:T(`En finalización suelen usarse alrededor de ${c.xanObj} mg/kg de xantofilas totales (maíz amarillo, gluten de maíz y pigmento de cempasúchil). El sorgo casi no aporta pigmento. Selecciona el pigmento en el Bloque 4.`,`Finisher feeds usually carry about ${c.xanObj} mg/kg total xanthophylls (yellow corn, corn gluten meal and marigold pigment). Sorghum supplies almost none. Select the pigment in Block 4.`), btn:'pigmento', bl:T(`Aplicar ${c.xanObj} mg/kg de xantofilas a esta fase`,`Apply ${c.xanObj} mg/kg xanthophylls to this phase`)});
  if(!rec.length) rec.push({t:'ok', h:T('Sin ajustes especiales','No special adjustments'), p:T('Con estas condiciones no se sugieren cambios a la tabla de requerimientos.','Under these conditions no changes to the requirement table are suggested.')});
  el.innerHTML = `${cabecera('condiciones',T('El ambiente y el mercado cambian lo que conviene formular. Este bloque no modifica nada por sí solo: te recomienda y tú decides si aplicarlo.','Environment and market change what is worth formulating. This block changes nothing by itself: it recommends and you decide.'))}
  ${teoriaDe(['ambiente','pigmento'])}
  <div class="card"><div class="grid g3">
    <label class="f"><span>${T('Altitud de la granja (msnm)','Farm altitude (m a.s.l.)')}${ayuda('altitud')}</span><input type="number" id="c_alt" value="${c.altitud}"></label>
    <label class="f"><span>${T('Temperatura media en la caseta (°C)','Mean house temperature (°C)')}${ayuda('temp')}</span><input type="number" id="c_temp" value="${c.temp}"></label>
    <label class="f"><span>${T('Número de aves en el lote','Number of birds in the flock')}${ayuda('aves')}</span><input type="number" id="c_aves" value="${c.aves}"></label>
    <label class="f"><span>${T('Tamaño de la mezcla o bache (kg)','Mixer batch size (kg)')}${ayuda('bache')}</span><input type="number" id="c_lote" value="${c.lote}"><span class="h">${T('Capacidad de tu mezcladora','Your mixer’s capacity')}</span></label>
    <label class="f">${T('Moneda (símbolo)','Currency (symbol)')}<input id="c_mon" value="${esc(S.moneda)}" maxlength="4"></label>
    <div class="f" style="font-size:14px;color:var(--muted)">${T('Mercado','Market')}
      <label class="row" style="color:var(--text);gap:8px"><input type="checkbox" id="c_pig" ${c.pigmentado?'checked':''}> ${T('Pollo pigmentado (piel amarilla)','Pigmented broiler (yellow skin)')}</label>
      <span class="row" style="gap:6px">${T('Xantofilas objetivo','Target xanthophylls')}${ayuda('Xan')} <input class="num" id="c_xan" value="${c.xanObj}"> mg/kg</span></div>
  </div></div>
  ${rec.map(r=>`<div class="alert ${r.t}"><b>${esc(r.h)}</b><p>${esc(r.p)}</p>${r.btn?`<button class="btn sm ghost" data-aplica="${r.btn}">${esc(r.bl)}</button>`:''}</div>`).join('')}
  ${siguiente('condiciones')}`;
  const set = (id,k)=>$(id,el).addEventListener('change',e=>{ S.cond[k]=num(e.target.value); guardar(); render(); });
  set('#c_alt','altitud'); set('#c_temp','temp'); set('#c_aves','aves'); set('#c_lote','lote'); set('#c_xan','xanObj');
  $('#c_pig',el).addEventListener('change',e=>{ S.cond.pigmentado=e.target.checked; guardar(); render(); });
  $('#c_mon',el).addEventListener('change',e=>{ S.moneda=e.target.value||'$'; guardar(); });
  $$('[data-aplica]',el).forEach(bn=>bn.addEventListener('click',()=>{
    const a = bn.dataset.aplica;
    if(a==='altitud'){ S.req.EM[0]-=50; if(S.req.EM[1]!=null) S.req.EM[1]-=50; }
    if(a==='calor'){ S.req.DEB=[230,300]; }
    if(a==='pigmento'){ S.req.Xan=[S.cond.xanObj,null]; S.sel.pigm=true; }
    S.reqEditado=true; S.resultado=null; guardar();
    bn.outerHTML = `<span class="badge ok">✓ ${T('Aplicado a los requerimientos del Bloque 2','Applied to the Block 2 requirements')}</span>`;
    toast(T('Ajuste aplicado','Adjustment applied'));
  }));
}

/* ================= BLOQUE 4 · INGREDIENTES ================= */
let ingDetalle = null;
function renderIngredientes(el){
  const base = GENETICAS[S.genetica].base;
  const nSel = S.ingredientes.filter(i=>S.sel[i.id]).length;
  const filas = CATS.map(cat=>{
    const lista = S.ingredientes.filter(i=>i.cat===cat); if(!lista.length) return '';
    return `<tr class="cat"><td colspan="9">${esc(tx(CAT[cat]))}</td></tr>` + lista.map(i=>`
      <tr><td><label class="row" style="gap:8px;flex-wrap:nowrap"><input type="checkbox" data-sel="${i.id}" ${S.sel[i.id]?'checked':''}> ${esc(tx(i.nombre))}</label></td>
      <td class="r">${fmt(i.comp.EM,0)}</td><td class="r">${fmt(i.comp.PC,1)}</td>
      <td class="r sci">${fmt(valorNut(i,'Lys',base),2)}</td><td class="r sci">${fmt(valorNut(i,'MC',base),2)}</td>
      <td class="r">${fmt(i.comp.Ca,2)}</td><td class="r sci">${fmt(i.comp.Pd,2)}</td>
      <td class="small muted wrap" style="min-width:220px">${esc(tx(i.nota)||'')}</td>
      <td><button class="btn ghost sm" data-det="${i.id}">${T('Editar','Edit')}</button></td></tr>`).join('');
  }).join('');
  el.innerHTML = `${cabecera('ingredientes',T('Marca los ingredientes que realmente puedes conseguir. Los valores vienen de tablas; si tienes análisis de laboratorio de tus materias primas, cámbialos con el botón Editar.','Tick the ingredients you can actually buy. Values come from feed tables; if you have laboratory analyses of your feedstuffs, change them with the Edit button.'))}
  ${teoriaDe(['ingredientes'])}
  <div class="alert info small">${T('Seleccionados','Selected')}: <b>${nSel}</b>. ${T('Aminoácidos en base','Amino acids on a')} <b>${base==='dig'?T('digestible','digestible'):'total'}</b>${ayuda('base')} ${T('(según la línea elegida). Valores en base tal como se ofrece (≈88–90 % de materia seca).','basis (per the chosen line). Values on an as-fed basis (≈88–90 % dry matter).')}</div>
  <div class="card hide" id="detalle"></div>
  <div class="card">
    <div class="row between" style="margin-bottom:10px">
      <h3 style="margin:0">${T('Biblioteca de ingredientes','Ingredient library')}</h3>
      <span class="row"><input id="nuevoNombre" placeholder="${T('Nombre del nuevo ingrediente','New ingredient name')}" style="max-width:250px"><button class="btn sm" id="nuevo">+ ${T('Agregar','Add')}</button></span>
    </div>
    <div class="tbl"><table>
      <thead><tr><th>${T('Ingrediente','Ingredient')}</th><th class="r">EM kcal${ayuda('EM')}</th><th class="r">${T('PC','CP')} %${ayuda('PC')}</th><th class="r sci">${T('Lis','Lys')} %${ayuda('Lys')}</th><th class="r sci">M+C %${ayuda('MC')}</th><th class="r">Ca %${ayuda('Ca')}</th><th class="r sci">${T('Pd','avP')} %${ayuda('Pd')}</th><th>${T('Notas','Notes')}</th><th></th></tr></thead>
      <tbody>${filas}</tbody></table></div>
  </div>
  ${siguiente('ingredientes')}`;
  $$('[data-sel]',el).forEach(c=>c.addEventListener('change',()=>{ S.sel[c.dataset.sel]=c.checked; S.resultado=null; S.programa=null; guardar(); render(); }));
  $$('[data-det]',el).forEach(bn=>bn.addEventListener('click',()=>{ ingDetalle=bn.dataset.det; pintarDetalle(); $('#detalle').scrollIntoView({behavior:'smooth',block:'start'}); }));
  $('#nuevo',el).addEventListener('click',()=>{
    const nombre = $('#nuevoNombre').value.trim() || T('Ingrediente nuevo','New ingredient');
    const id = 'c'+Date.now().toString(36);
    const comp = {}; ING_COLS.forEach(k=>comp[k]=0); comp.MS=88;
    S.ingredientes.push({id, nombre, cat:'per', comp, precio:0, min:0, max:100, nota:{es:'Captura su composición.',en:'Enter its composition.'}, custom:true});
    S.sel[id]=true; ingDetalle=id; guardar(); render(); toast(T('Ingrediente agregado','Ingredient added'));
  });
  pintarDetalle();
}
function pintarDetalle(){
  const box = $('#detalle'); if(!box) return;
  const ing = S.ingredientes.find(i=>i.id===ingDetalle);
  if(!ing){ box.classList.add('hide'); return; }
  box.classList.remove('hide');
  const campos = [['MS',T('Materia seca','Dry matter'),'%'],['EM',T('EMAn','AMEn'),'kcal/kg'],['PC',T('Proteína cruda','Crude protein'),'%'],['EE',T('Extracto etéreo','Ether extract'),'%'],['FC',T('Fibra cruda','Crude fiber'),'%'],['Ca',T('Calcio','Calcium'),'%'],['Pd',T('P disponible','Available P'),'%'],['Na',T('Sodio','Sodium'),'%'],['Cl',T('Cloro','Chloride'),'%'],['K',T('Potasio','Potassium'),'%'],['AL',T('Ác. linoleico','Linoleic acid'),'%'],['Xan',T('Xantofilas','Xanthophylls'),'mg/kg']];
  box.innerHTML = `<div class="row between"><h3 style="margin:0">${T('Composición','Composition')}: ${esc(tx(ing.nombre))}</h3><span class="row">${ing.custom?`<button class="btn danger sm" id="borrarIng">${T('Eliminar','Delete')}</button>`:`<button class="btn ghost sm" id="resetIng">↺ ${T('Valores de tabla','Table values')}</button>`}<button class="btn sm" id="cerrarDet">${T('Cerrar','Close')}</button></span></div>
    <div class="grid g4" style="margin-top:12px">
      <label class="f">${T('Nombre','Name')}<input data-campo="nombre" value="${esc(tx(ing.nombre))}"></label>
      <label class="f">${T('Categoría','Category')}<select data-campo="cat">${CATS.map(c=>`<option value="${c}" ${c===ing.cat?'selected':''}>${esc(tx(CAT[c]))}</option>`).join('')}</select></label>
      ${campos.map(([k,n,u])=>`<label class="f"><span>${n} (${u})${ayuda(k)}</span><input data-comp="${k}" value="${ing.comp[k]}" inputmode="decimal"></label>`).join('')}
    </div>
    <h4 class="sci">${T('Aminoácidos (%): total · digestible','Amino acids (%): total · digestible')}</h4>
    <div class="grid g4 sci">${AA_KEYS.map(k=>`<label class="f"><span>${esc(tx(NUT[k].n))}${ayuda(k)}</span><span class="row" style="flex-wrap:nowrap;gap:6px"><input data-comp="${k}" value="${ing.comp[k]}" title="Total" inputmode="decimal"><input data-comp="d${k}" value="${ing.comp['d'+k]}" title="${T('Digestible','Digestible')}" inputmode="decimal"></span></label>`).join('')}</div>`;
  $$('[data-comp]',box).forEach(i=>i.addEventListener('change',()=>{ ing.comp[i.dataset.comp]=num(i.value)||0; S.resultado=null; guardar(); }));
  $$('[data-campo]',box).forEach(i=>i.addEventListener('change',()=>{ ing[i.dataset.campo]=i.value; guardar(); render(); }));
  $('#cerrarDet').addEventListener('click',()=>{ ingDetalle=null; pintarDetalle(); });
  const bb = $('#borrarIng'); if(bb) bb.addEventListener('click',()=>{ S.ingredientes=S.ingredientes.filter(i=>i.id!==ing.id); delete S.sel[ing.id]; ingDetalle=null; guardar(); render(); });
  const rb = $('#resetIng'); if(rb) rb.addEventListener('click',()=>{ const n=ingDesdeLib(ING_LIB.find(x=>x[0]===ing.id)); ing.comp=n.comp; ing.nombre=n.nombre; ing.cat=n.cat; guardar(); render(); });
}

/* ================= BLOQUE 5 · PRECIOS ================= */
function renderPrecios(el){
  const sel = S.ingredientes.filter(i=>S.sel[i.id]);
  el.innerHTML = `${cabecera('precios',T('Captura el precio que tú pagas por kg puesto en granja (con flete). Los precios precargados son solo ejemplos. Los límites de inclusión evitan fórmulas baratas pero poco prácticas o riesgosas.','Enter the price you pay per kg delivered to the farm (freight included). Preloaded prices are only examples. Inclusion limits prevent cheap but impractical or risky formulas.'))}
  ${teoriaDe(['limites'])}
  ${sel.length?'':`<div class="empty">${ill('i-sack')}<p>${T('No hay ingredientes seleccionados. Regresa al Bloque 4.','No ingredients selected. Go back to Block 4.')}</p></div>`}
  <div class="card">
    <div class="row between" style="margin-bottom:10px"><h3 style="margin:0">${T('Precios y límites','Prices and limits')} · ${sel.length} ${T('ingredientes','ingredients')}</h3><span class="small muted">${T('Precio por tonelada = precio por kg × 1000','Price per tonne = price per kg × 1000')}</span></div>
    <div class="tbl"><table>
      <thead><tr><th>${T('Ingrediente','Ingredient')}</th><th class="r">${esc(S.moneda)}/kg${ayuda('precio')}</th><th class="r">${esc(S.moneda)}/t</th><th class="r">${T('Mínimo','Minimum')} %${ayuda('incl')}</th><th class="r">${T('Máximo','Maximum')} %</th><th class="r">${esc(S.moneda)} ${T('por 1,000 kcal','per 1,000 kcal')}${ayuda('pkcal')}</th><th class="r">${esc(S.moneda)} ${T('por kg de PC','per kg CP')}${ayuda('ppc')}</th></tr></thead>
      <tbody>${sel.map(i=>`<tr>
        <td>${esc(tx(i.nombre))}</td>
        <td class="r"><input class="num" data-pr="${i.id}" data-f="precio" value="${i.precio}"></td>
        <td class="r muted" data-pt="${i.id}">${fmt(i.precio*1000,0)}</td>
        <td class="r"><input class="num" data-pr="${i.id}" data-f="min" value="${i.min??0}"></td>
        <td class="r"><input class="num" data-pr="${i.id}" data-f="max" value="${i.max??''}"></td>
        <td class="r muted">${i.comp.EM>0?fmt(i.precio/i.comp.EM*1000,2):'—'}</td>
        <td class="r muted">${i.comp.PC>0?fmt(i.precio/(i.comp.PC/100),2):'—'}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">${T('Para fijar una inclusión exacta (p. ej. premezcla 0.25 %) escribe el mismo valor en mínimo y máximo. Las dos últimas columnas dicen qué tan barata sale la energía o la proteína de cada ingrediente.','To fix an exact inclusion (e.g. premix 0.25 %) enter the same value as minimum and maximum. The last two columns show how cheap energy or protein is from each ingredient.')}</p>
  </div>
  ${siguiente('precios')}`;
  $$('[data-pr]',el).forEach(inp=>inp.addEventListener('change',()=>{
    const ing = S.ingredientes.find(i=>i.id===inp.dataset.pr); const v = num(inp.value);
    ing[inp.dataset.f] = inp.dataset.f==='max' ? v : (v||0);
    if(inp.dataset.f==='precio'){ const td=$(`[data-pt="${ing.id}"]`); if(td) td.textContent=fmt(ing.precio*1000,0); }
    S.resultado=null; S.programa=null; guardar();
  }));
}
</script>
<script>
"use strict";
/* ================= BLOQUE 6 · FORMULACIÓN ================= */
function renderFormulacion(el){
  const g = GENETICAS[S.genetica], f = fasesDe(S.genetica)[S.fase];
  const sel = S.ingredientes.filter(i=>S.sel[i.id]);
  el.innerHTML = `${cabecera('formulacion',T('Resumen de lo capturado. Presiona Formular para calcular la dieta de mínimo costo; abajo también puedes evaluar una fórmula que ya tengas.','Summary of your inputs. Press Formulate to compute the least-cost diet; below you can also evaluate a formula you already use.'))}
  ${teoriaDe(['lp','lectura'])}
  <div class="card"><div class="row between">
    <div class="chips">
      <span class="badge pri">${esc(tx(g.nombre))}</span><span class="badge pri">${esc(tx(SEXOS[S.sexo].n))}</span>
      <span class="badge pri">${esc(tx(f.nombre))} · ${esc(tx(f.dias))}</span><span class="badge pri">${sel.length} ${T('ingredientes','ingredients')}</span>
      ${S.reqEditado?`<span class="badge warn">${T('requerimientos editados','edited requirements')}</span>`:''}
    </div>
    <button class="btn lg accent" id="formular">⚙ ${T('Formular','Formulate')}</button></div></div>
  <div id="res"></div>
  <div class="card">
    <h3>${T('Evaluar una fórmula existente','Evaluate an existing formula')}${ayuda('evaluar')}</h3>
    <p class="small muted" style="margin-top:0">${T('Escribe los porcentajes de una fórmula que ya uses (o de un artículo) y la app calcula su aporte y su costo con tu matriz y tus precios, comparado contra los requerimientos de la fase.','Type the percentages of a formula you already use (or from a paper) and the app computes its nutrient supply and cost with your matrix and prices, against the phase requirements.')}</p>
    <div class="grid g4">${sel.map(i=>`<label class="f">${esc(tx(i.nombre))}<input data-ev="${i.id}" value="${S.evaluar[i.id]??''}" placeholder="0" inputmode="decimal"></label>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn" id="btnEval">${T('Evaluar fórmula','Evaluate formula')}</button><button class="btn ghost sm" id="copiarOpt">${T('Copiar la fórmula óptima aquí','Copy the optimal formula here')}</button><button class="btn link" id="limpiarEv">${T('Limpiar','Clear')}</button></div>
    <div id="resEval" style="margin-top:14px"></div>
  </div>
  ${siguiente('formulacion')}`;
  $('#formular',el).addEventListener('click',()=>{ S.resultado = formular(S); guardar(); pintarResultado(); actualizarPill(); $('#res').scrollIntoView({behavior:'smooth'}); toast(S.resultado.ok?T('Dieta óptima encontrada','Optimal diet found'):T('Sin solución: revisa el diagnóstico','No solution: see the diagnosis')); });
  $$('[data-ev]',el).forEach(i=>i.addEventListener('change',()=>{ S.evaluar[i.dataset.ev]=num(i.value); guardar(); }));
  $('#btnEval',el).addEventListener('click',pintarEvaluacion);
  $('#limpiarEv',el).addEventListener('click',()=>{ S.evaluar={}; guardar(); render(); });
  $('#copiarOpt',el).addEventListener('click',()=>{ if(!S.resultado||!S.resultado.ok) return; S.evaluar={}; S.resultado.formula.forEach(x=>{ if(x.pct>1e-6) S.evaluar[x.id]=+x.pct.toFixed(3); }); guardar(); render(); pintarEvaluacion(); });
  pintarResultado();
}
function tablaNutrientes(nutr, req, base, restr){
  return `<div class="tbl"><table><thead><tr><th>${T('Nutriente','Nutrient')}</th><th>${T('Unidad','Unit')}</th><th class="r">${T('Mín.','Min.')}</th><th class="r">${T('Máx.','Max.')}</th><th class="r">${T('Aporte','Supplied')}</th><th>${T('Estado','Status')}${ayuda('estado')}</th>${restr?`<th class="r sci">${T('Costo marginal /t (+1 % req.)','Marginal cost /t (+1 % req.)')}${ayuda('marg')}</th>`:''}</tr></thead><tbody>
  ${NUTRIENTES.map(nu=>{
    const v = nutr[nu.k], q = req[nu.k]||[null,null];
    let est=`<span class="badge ok">${T('cumple','met')}</span>`, marg='';
    if(q[0]==null && q[1]==null) est=`<span class="muted small">${T('informativo','informative')}</span>`;
    else if(q[0]!=null && v < q[0]-1e-6*Math.max(1,q[0])) est=`<span class="badge bad">${T('bajo el mínimo','below minimum')}</span>`;
    else if(q[1]!=null && v > q[1]+1e-6*Math.max(1,q[1])) est=`<span class="badge bad">${T('sobre el máximo','above maximum')}</span>`;
    if(restr){
      const rmin = restr.find(x=>x.tag==='nmin_'+nu.k), rmax = restr.find(x=>x.tag==='nmax_'+nu.k);
      if(rmin&&rmin.activa){ est=`<span class="badge warn">${T('en el mínimo · limitante','at minimum · binding')}</span>`; marg = money(10*rmin.dual*rmin.req); }
      else if(rmax&&rmax.activa){ est=`<span class="badge warn">${T('en el máximo · limitante','at maximum · binding')}</span>`; marg = money(10*rmax.dual*rmax.req); }
    }
    return `<tr class="${KEYN.includes(nu.k)?'':'sci'}"><td>${esc(tx(nu.n))}${nu.aa?` <span class="muted tiny">(${base==='dig'?'dig.':'total'})</span>`:''}${ayuda(nu.k)}</td><td class="muted">${nu.u}</td><td class="r">${q[0]!=null?fmt(q[0],nu.d):'—'}</td><td class="r">${q[1]!=null?fmt(q[1],nu.d):'—'}</td><td class="r"><b>${fmt(v,nu.d)}</b></td><td>${est}</td>${restr?`<td class="r sci">${marg}</td>`:''}</tr>`;
  }).join('')}</tbody></table></div>`;
}
function barrasCumplimiento(nutr, req){
  const ks = NUTRIENTES.filter(nu=>req[nu.k] && req[nu.k][0]!=null && req[nu.k][0]>0 && nu.k!=='DEB');
  return ks.map(nu=>{ const p = 100*nutr[nu.k]/req[nu.k][0]; const w = Math.min(p,150)/150*100;
    return `<div class="cmpbar ${KEYN.includes(nu.k)?'':'sci'}"><span>${esc(tx(nu.n)).replace(/\s*\(.*\)/,'')}</span><div class="tr"><i class="${p>112?'hi':''}" style="width:${w.toFixed(1)}%"></i><b style="left:${(100/150*100).toFixed(1)}%"></b></div><span class="p">${fmt(p,0)} %</span></div>`; }).join('');
}
function tablaIndicadores(n){
  const L = n.Lys||1;
  const ind = [
    [T('Relación Ca : P disponible','Ca : available P ratio'), n.Pd?fmt(n.Ca/n.Pd,2)+' : 1':'—', '1.8–2.1 : 1', n.Pd && n.Ca/n.Pd>=1.7 && n.Ca/n.Pd<=2.3,'CaP'],
    [T('Balance electrolítico (Na+K−Cl)','Electrolyte balance (Na+K−Cl)'), fmt(n.DEB,0)+' mEq/kg', T('200–300 (óptimo ≈250)','200–300 (optimum ≈250)'), n.DEB>=200&&n.DEB<=300,'DEB'],
    [T('Relación EM : PC','ME : CP ratio'), n.PC?fmt(n.EM/n.PC,0)+' kcal/%':'—', T('informativo','informative'), null,'EMPC'],
    [T('Met+Cis : Lis','Met+Cys : Lys'), fmt(100*n.MC/L,0), '74–78', 100*n.MC/L>=73,'MCLys'],
    [T('Treonina : Lis','Threonine : Lys'), fmt(100*n.Thr/L,0), '65–68', 100*n.Thr/L>=64,'ThrLys'],
    [T('Valina : Lis','Valine : Lys'), fmt(100*n.Val/L,0), '76–80', 100*n.Val/L>=75,'ValLys'],
    [T('Arginina : Lis','Arginine : Lys'), fmt(100*n.Arg/L,0), '105–110', 100*n.Arg/L>=104,'ArgLys'],
    [T('Grasa total (EE)','Total fat (EE)'), fmt(n.EE,2)+' %', T('< 7 % para buen pellet','< 7 % for good pellets'), n.EE<7,'pellet']
  ];
  return `<div class="tbl"><table><thead><tr><th>${T('Indicador','Indicator')}</th><th class="r">${T('Valor','Value')}</th><th>${T('Referencia','Reference')}</th><th></th></tr></thead>
    <tbody>${ind.map(i=>`<tr class="${['CaP','DEB','pellet'].includes(i[4])?'':'sci'}"><td>${i[0]}${ayuda(i[4])}</td><td class="r">${i[1]}</td><td class="muted">${i[2]}</td><td>${i[3]===null?'':i[3]?'<span class="badge ok">✓</span>':`<span class="badge warn">${T('revisar','check')}</span>`}</td></tr>`).join('')}</tbody></table></div>`;
}
function pintarResultado(){
  const box = $('#res'); if(!box) return;
  const r = S.resultado;
  if(!r){ box.innerHTML = `<div class="empty">${ill('i-scale')}<p>${T('Aún no hay resultado (o cambiaste algún dato). Presiona <b>Formular</b> y la balanza encontrará el equilibrio entre nutrientes y costo.','No result yet (or you changed an input). Press <b>Formulate</b> and the scale will find the balance between nutrients and cost.')}</p></div>`; return; }
  if(!r.ok){
    const d = r.diagnostico||{};
    box.innerHTML = `<div class="alert bad"><b>${T('Sin solución.','No solution.')}</b><p>${esc(r.motivo)}</p>
      ${d.sinFuente&&d.sinFuente.length?`<p><b>${T('Ningún ingrediente seleccionado aporta:','No selected ingredient supplies:')}</b> ${d.sinFuente.map(esc).join(', ')}.</p>`:''}
      ${d.culpables&&d.culpables.length?`<p><b>${T('Si relajas UNA de estas restricciones sí hay solución:','Relaxing ONE of these constraints gives a solution:')}</b></p><ul>${d.culpables.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:`<p>${T('No basta con relajar una sola restricción: revisa varios requerimientos o agrega ingredientes (aceite para energía, aminoácidos sintéticos, fosfato).','Relaxing a single constraint is not enough: review several requirements or add ingredients (oil for energy, synthetic amino acids, phosphate).')}</p>`}</div>`;
    return;
  }
  const lote = S.cond.lote||1000, cons = r.contexto.consumo, gan = r.contexto.ganancia;
  const nombre = x => tx((S.ingredientes.find(i=>i.id===x.id)||{nombre:x.nombre}).nombre);
  const usados = r.formula.filter(x=>x.pct>1e-6).sort((a,b)=>b.pct-a.pct);
  const noUsados = r.formula.filter(x=>x.pct<=1e-6);
  const maxPct = Math.max(...usados.map(x=>x.pct));
  const totalKg = cons && S.cond.aves ? cons*S.cond.aves : null;
  const fijos = new Set(S.ingredientes.filter(i=>i.min>0 && i.min===i.max).map(i=>i.id));
  const limIng = r.restr.filter(x=>x.tipo==='ing' && x.activa && !fijos.has(x.id));
  const lim1 = r.restr.filter(x=>x.tipo==='nut'&&x.activa&&x.lado==='min'&&x.dual*x.req>1e-9).sort((a,b)=>b.dual*b.req-a.dual*a.req)[0];
  const entra = noUsados.filter(x=>x.reducido>1e-6&&x.precio-x.reducido>0).sort((a,b)=>a.reducido/a.precio-b.reducido/b.precio).slice(0,2);
  const granja = [
    T(`La dieta cuesta <b>${money(r.costoKg*1000)}</b> por tonelada (${money(r.costoKg)} por kg).`,`The diet costs <b>${money(r.costoKg*1000)}</b> per tonne (${money(r.costoKg)} per kg).`),
    cons ? T(`En esta etapa cada pollo come unos ${fmt(cons,2)} kg: te cuesta <b>${money(r.costoKg*cons)}</b> por pollo.`,`In this phase each bird eats about ${fmt(cons,2)} kg: it costs you <b>${money(r.costoKg*cons)}</b> per bird.`) : T('Captura el consumo por ave en el Bloque 2 para saber cuánto te cuesta cada pollo.','Enter intake per bird in Block 2 to know the cost per bird.'),
    cons&&gan ? T(`Cada kilo de peso que gana el pollo te cuesta <b>${money(r.costoKg*cons/gan)}</b> de alimento.`,`Each kilo of weight the bird gains costs you <b>${money(r.costoKg*cons/gan)}</b> in feed.`) : '',
    totalKg ? T(`Para tus ${fmt(S.cond.aves,0)} aves necesitas <b>${fmt(totalKg/1000,1)} t</b> de alimento en esta etapa (≈ ${money(r.costoKg*totalKg)}).`,`For your ${fmt(S.cond.aves,0)} birds you need <b>${fmt(totalKg/1000,1)} t</b> of feed in this phase (≈ ${money(r.costoKg*totalKg)}).`) : '',
    lim1 ? T(`Lo que más encarece esta dieta es cubrir la <b>${esc(minus(tx(NUT[lim1.k].n)))}</b>. Si consigues a buen precio un ingrediente rico en ella, la dieta puede bajar.`,`What makes this diet most expensive is meeting <b>${esc(minus(tx(NUT[lim1.k].n)))}</b>. An affordable ingredient rich in it could lower the cost.`) : '',
    ...entra.map(x=>T(`Si consigues <b>${esc(nombre(x))}</b> a ${money(x.precio-x.reducido)} por kg o menos, vuelve a formular: empezaría a convenirte.`,`If you can buy <b>${esc(nombre(x))}</b> at ${money(x.precio-x.reducido)} per kg or less, reformulate: it would start to pay off.`))
  ].filter(Boolean);
  box.innerHTML = `
  <div class="alert ok prod"><b>${T('✓ Esta es la dieta más barata posible','✓ This is the cheapest possible diet')}</b> ${T('con tus ingredientes y tus precios, y cumple todo lo que tus pollos necesitan en esta etapa.','with your ingredients and prices, and it meets everything your birds need in this phase.')}</div>
  <div class="alert sci ${r.cert.ok?'ok':'warn'}"><b>${r.cert.ok?T('✓ Solución óptima certificada.','✓ Certified optimal solution.'):T('Solución encontrada.','Solution found.')}</b> ${usados.length} ${T('ingredientes.','ingredients.')} ${r.cert.ok?T('Se comprobó por dualidad fuerte que no existe otra combinación más barata que cumpla las mismas restricciones','Strong duality proves that no cheaper combination meets the same constraints'):T('Revisa el certificado','Check the certificate')} (${T('brecha primal–dual','primal–dual gap')} ${r.cert.brecha.toExponential(1)}; ${T('violación máxima','max. violation')} ${r.cert.viol.toExponential(1)}).${ayuda('cert')}</div>
  <div class="kpis">
    <div class="kpi"><div class="l">${T('Costo por tonelada','Cost per tonne')}${ayuda('costoT')}</div><div class="v">${money(r.costoKg*1000)}</div><div class="s">${money(r.costoKg)} ${T('por kg','per kg')}</div></div>
    <div class="kpi"><div class="l">${T('Alimento por ave en la fase','Feed cost per bird (phase)')}${ayuda('costoAve')}</div><div class="v">${cons?money(r.costoKg*cons):'—'}</div><div class="s">${cons?fmt(cons,2)+' '+T('kg por ave','kg per bird'):T('captura el consumo (Bloque 2)','enter intake (Block 2)')}</div></div>
    <div class="kpi"><div class="l">${T('Costo de alimento / kg ganado','Feed cost / kg gained')}${ayuda('costoKgGan')}</div><div class="v">${cons&&gan?money(r.costoKg*cons/gan):'—'}</div><div class="s">${T('conversión','FCR')} ${cons&&gan?fmt(cons/gan,2):'—'}</div></div>
    <div class="kpi"><div class="l">${T('Alimento para el lote','Feed for the flock')}${ayuda('loteAlim')}</div><div class="v">${totalKg?fmt(totalKg/1000,1)+' t':'—'}</div><div class="s">${totalKg?fmt(S.cond.aves,0)+' '+T('aves','birds')+' · '+money(r.costoKg*totalKg):''}</div></div>
  </div>

  <div class="card prod"><h3>${T('Qué significa para tu granja','What it means for your farm')}</h3>
    <ul class="granja">${granja.map(t=>`<li>${t}</li>`).join('')}</ul></div>
  <div class="card prod"><div class="row between"><h3 style="margin:0">${T('Hoja de mezclado','Mixing sheet')} · ${T('bache de','batch of')} ${fmt(lote,0)} kg${ayuda('bache')}</h3><button class="btn ghost sm no-print" onclick="window.print()">🖨 ${T('Imprimir','Print')}</button></div>
    <p class="small muted" style="margin:6px 0 0">${T('Marca cada ingrediente conforme lo pesas. Los que entran a menos de 0.5 % mézclalos antes con un poco de maíz molido (premezcla) para que se repartan bien.','Tick each ingredient as you weigh it. Mix those below 0.5 % with a little ground corn first (premix) so they spread evenly.')}</p>
    <div class="mezcla">${usados.map(x=>{ const kg=x.pct/100*lote; return `<label><span><input type="checkbox">${esc(nombre(x))}</span><b>${fmt(kg, kg<1?3:(kg<10?2:1))} kg</b></label>`; }).join('')}</div>
    <p class="small muted" style="margin:0">${T('Total','Total')}: <b>${fmt(lote,0)} kg</b> · ${T('costo del bache','batch cost')}: <b>${money(r.costoKg*lote)}</b></p></div>
  <div class="card"><h3>${T('Fórmula','Formula')}</h3>
    <div class="chart-wrap" style="margin-bottom:14px">${dona(usados.map(x=>({n:nombre(x),v:x.pct})))}
      <div class="legend">${usados.slice(0,12).map((x,i)=>`<span><i style="background:${PALETA[i%PALETA.length]}"></i>${esc(nombre(x))} · <b>${fmt(x.pct,2)} %</b></span>`).join('')}</div></div>
    <div class="tbl"><table>
    <thead><tr><th>${T('Ingrediente','Ingredient')}</th><th class="r">%</th><th style="width:22%"></th><th class="r">${T('kg por bache de','kg per batch of')} ${fmt(lote,0)} kg</th><th class="r">${esc(S.moneda)}/kg</th><th class="r">${T('Aporte al costo','Cost share')} ${esc(S.moneda)}/t</th></tr></thead>
    <tbody>${usados.map(x=>`<tr><td>${esc(nombre(x))}</td><td class="r"><b>${fmt(x.pct,3)}</b></td><td><div class="bar-h" style="width:${(x.pct/maxPct*100).toFixed(1)}%"></div></td><td class="r">${fmt(x.pct/100*lote,2)}</td><td class="r">${fmt(x.precio,2)}</td><td class="r">${fmt(x.pct*x.precio*10,2)}</td></tr>`).join('')}
    <tr class="tot"><td>Total</td><td class="r">${fmt(usados.reduce((a,x)=>a+x.pct,0),3)}</td><td></td><td class="r">${fmt(lote,2)}</td><td></td><td class="r">${fmt(r.costoKg*1000,2)}</td></tr></tbody></table></div></div>
  <div class="card"><h3>${T('Aporte frente al requerimiento','Supply versus requirement')}${ayuda('cumpl')}</h3><p class="small muted" style="margin-top:0">${T('La línea vertical marca el 100 % del mínimo. Las barras doradas indican un exceso mayor al 12 %.','The vertical line marks 100 % of the minimum. Gold bars flag an excess above 12 %.')}</p>${barrasCumplimiento(r.nutr, r.contexto.req)}</div>
  <div class="card"><h3>${T('Aporte nutricional','Nutrient supply')}</h3>${tablaNutrientes(r.nutr, r.contexto.req, r.base, r.restr)}</div>
  <div class="card"><h3>${T('Indicadores de calidad','Quality indicators')}</h3>${tablaIndicadores(r.nutr)}</div>
  <div class="card"><h3><span class="sci">${T('Análisis de sensibilidad','Sensitivity analysis')}</span><span class="prod">${T('¿Qué ingredientes conviene vigilar?','Which ingredients are worth watching?')}</span></h3><div class="grid g2">
    <div><h4 style="margin-top:0">${T('Ingredientes no usados · precio de entrada','Unused ingredients · entry price')}${ayuda('entrada')}</h4>
    ${noUsados.length?`<div class="tbl"><table><thead><tr><th>${T('Ingrediente','Ingredient')}</th><th class="r">${T('Precio actual','Current price')}</th><th class="r">${T('Entraría a','Would enter at')}</th></tr></thead><tbody>

      <p class="small muted sci" style="max-width:88ch">${T('Cítese el software como','Cite the software as')}: ${esc(tx(CONFIG.citaAutores))} (${CONFIG.anio}). <i>${CONFIG.app}: ${esc(tx(CONFIG.titulo))}</i> (${T('Versión','Version')} ${CONFIG.version}) [Software]. ${CONFIG.doi?'https://doi.org/'+CONFIG.doi:esc(CONFIG.repo)}</p>
      <div class="tbl"><table><thead><tr><th>${T('Ingrediente','Ingredient')}</th><th class="r">%</th><th class="r">kg / t</th></tr></thead><tbody>
      ${usados.map(x=>`<tr><td>${esc(nombre(x))}</td><td class="r">${fmt(x.pct,3)}</td><td class="r">${fmt(x.pct*10,2)}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  el.innerHTML = `${cabecera('informe',T('Genera tu reporte, descarga las tablas o guarda todo el proyecto en un archivo para abrirlo en otra computadora.','Generate your report, download the tables or save the whole project to a file to open it on another computer.'))}
  ${resumen}
  <div class="card no-print"><h3>${T('Exportar','Export')}</h3>
    <div class="row">
      <button class="btn" id="imprimir" ${r&&r.ok?'':'disabled'}>🖨 ${T('Imprimir / PDF','Print / PDF')}</button>

      <button class="btn ghost" id="csvN" ${r&&r.ok?'':'disabled'}>⬇ ${T('Nutrientes (CSV)','Nutrients (CSV)')}</button>
    </div>
    <h4>${T('Proyecto','Project')}</h4>
    <div class="row">
      <button class="btn ghost" id="guardarP">💾 ${T('Guardar proyecto (.json)','Save project (.json)')}</button>
      <label class="btn ghost">📂 ${T('Abrir proyecto','Open project')}<input type="file" id="abrirP" accept=".json,application/json" hidden></label>
      <button class="btn danger" id="reiniciar">${T('Reiniciar todo','Reset everything')}</button>
    </div>
    <p class="small muted">${T('Tu trabajo también se guarda automáticamente en este navegador.','Your work is also saved automatically in this browser.')}</p>
  </div>
  ${siguiente('informe')}`;
  if(r&&r.ok){
    $('#imprimir').addEventListener('click',()=>window.print());
    $('#csvF').addEventListener('click',()=>{ const u = r.formula.filter(x=>x.pct>1e-6).sort((a,b)=>b.pct-a.pct);
      descargar(slug()+T('_formula.csv','_formula.csv'), csv([[T('Ingrediente','Ingredient'),T('Porcentaje','Percent'),T('kg por tonelada','kg per tonne'),T('Precio por kg','Price per kg'),T('Aporte al costo por t','Cost share per t')], ...u.map(x=>[nombre(x),x.pct.toFixed(4),(x.pct*10).toFixed(3),x.precio,(x.pct*x.precio*10).toFixed(2)]), ['Total',100,1000,'',(r.costoKg*1000).toFixed(2)]]), 'text/csv'); });
    $('#csvN').addEventListener('click',()=>{ descargar(slug()+T('_nutrientes.csv','_nutrients.csv'), csv([[T('Nutriente','Nutrient'),T('Unidad','Unit'),T('Minimo','Minimum'),T('Maximo','Maximum'),T('Aporte','Supplied')], ...NUTRIENTES.map(nu=>{ const q=r.contexto.req[nu.k]||[]; return [tx(nu.n),nu.u,q[0]??'',q[1]??'',(+r.nutr[nu.k]).toFixed(4)]; })]), 'text/csv'); });
  }
  $('#guardarP').addEventListener('click',()=>{ descargar(slug()+'.json', JSON.stringify(S,null,1), 'application/json'); toast(T('Proyecto guardado','Project saved')); });
