    file.text().then(t=>{ try{ const s=JSON.parse(t); if(s.version!==1||!s.req) throw 0; S=completarEstado(s); guardar(); irA('inicio'); toast(T('Proyecto abierto','Project opened')); }catch(_){ e.target.closest('.card').insertAdjacentHTML('beforeend',`<div class="alert bad">${T('El archivo no es un proyecto válido de RatioAvis.','The file is not a valid RatioAvis project.')}</div>`); } }); });
  $('#reiniciar').addEventListener('click',e=>{ if(e.target.dataset.conf){ S=estadoInicial(); cargarRequerimientos(S); guardar(); irA('inicio'); } else { e.target.dataset.conf='1'; e.target.textContent=T('¿Seguro? Presiona otra vez para borrar todo','Sure? Press again to erase everything'); } });
}
</script>
<script>
"use strict";
/* ================= VALIDACIÓN / VALIDATION ================= */
function correrCaso(caso, fi){
  const fase = caso.fases[fi];
  const ings = ING_LIB.map(ingDesdeLib); // matriz y precios de la biblioteca / library matrix and prices
  const sumaPub = fase.f.reduce((a,x)=>a+x[1],0);
  const fN = fase.f.map(([id,p])=>[id, p*100/sumaPub]);
  const formula = Object.fromEntries(fN);
  const an = analizar(formula, caso.base, ings); an.sumaPub = sumaPub;
  const comp = Object.entries(fase.rep).map(([k,v])=>{ const app = an.nutr[k]; return {k, rep:v, app, dif:app-v, pct:(app-v)/v*100, excl:fase.excl[k]}; });
  let reform = null, recup = null;
  const claves = Object.keys(fase.rep).filter(k=>!fase.excl[k] && k!=='EE' && k!=='FC');
  if(claves.length >= 4){
    const fijos = ['premix','colina','otros','pigm'];
    const sub = fN.map(([id,p])=>{ const i = ings.find(x=>x.id===id); const c = {...i};
      if(fijos.includes(id)){ c.min=p; c.max=p; } else { c.min=0; c.max=Math.max(i.max??100, p); } return c; });
    const armar = (valor)=>{ const req = {}; NUTRIENTES.forEach(n=>req[n.k]=[null,null]);
      claves.forEach(k=>{ const v = valor(k); req[k] = (k==='Ca'||k==='Pd'||k==='Na') ? [v, v+0.05] : [v, null]; });
      if(!claves.includes('Na')){ const v = an.nutr.Na*(1-1e-6); req.Na = [v, v+0.05]; }
      return req; };
    const reqA = armar(k=>fase.rep[k]);
    const rA = resolverModelo(construirModelo(sub, reqA, caso.base));
    const cumple = Object.entries(reqA).filter(([k,q])=>q[0]!=null).map(([k,q])=>({k, ok:(an.nutr[k]>=q[0]-1e-4)&&(q[1]==null||an.nutr[k]<=q[1]+1e-4)}));
    reform = {r:rA, costoPub:an.costoKg, cumple};
    const reqB = armar(k=>an.nutr[k]*(1-1e-6));
    const rB = resolverModelo(construirModelo(sub, reqB, caso.base));
    const igual = rB.ok && fN.every(([id,p])=>Math.abs(((rB.formula.find(x=>x.id===id)||{pct:0}).pct)-p) < 0.005);
    recup = {r:rB, costoPub:an.costoKg, ok: rB.ok && rB.costoKg <= an.costoKg*(1+1e-6), igual};
  }
  return {fase, an, comp, reform, recup};
}
function resumenValidacion(){
  const grupos = {EM:[],PC:[],AA:[],Min:[]};
  VALIDACION.forEach(c=>c.fases.forEach((_,i)=>{ correrCaso(c,i).comp.forEach(x=>{ if(x.excl) return;
    const g = x.k==='EM'?'EM':x.k==='PC'?'PC':AA_KEYS.includes(x.k)?'AA':['Ca','Pd','Na'].includes(x.k)?'Min':null; if(g) grupos[g].push(Math.abs(x.pct)); }); }));
  return Object.fromEntries(Object.entries(grupos).map(([k,v])=>[k,{n:v.length, mape: v.reduce((a,b)=>a+b,0)/(v.length||1), max: Math.max(0,...v)}]));
}
function resumenOptim(){
  let n=0, ok=0, cert=0, igual=0;
  VALIDACION.forEach(c=>c.fases.forEach((_,i)=>{ const R = correrCaso(c,i); if(!R.recup) return; n++;
    if(R.recup.ok) ok++; if(R.recup.igual) igual++; if(R.recup.r.ok && R.recup.r.cert.ok) cert++; }));
  return {n, ok, cert, igual};
}
function colorPct(p){ const a=Math.abs(p); return a<=3?'ok':a<=8?'warn':'bad'; }
function renderValidacion(el){
  const caso = VALIDACION.find(c=>c.id===S.valCaso) || VALIDACION[0];
  const res = resumenValidacion(), opt = resumenOptim();
  const etiquetas = {EM:T('Energía metabolizable','Metabolizable energy'),PC:T('Proteína cruda','Crude protein'),AA:T('Aminoácidos','Amino acids'),Min:T('Ca, P disponible y Na','Ca, available P and Na')};
  el.innerHTML = `${cabecera('validacion',T('¿La app da resultados correctos? Aquí se introducen, tal cual, dietas publicadas en revistas científicas y se compara lo que calcula RatioAvis contra lo que reportan los autores. Después se reformulan con la app para ver si llega a la misma dieta.','Does the app give correct results? Here, diets published in scientific journals are entered exactly as printed and RatioAvis’s calculations are compared with what the authors report. They are then reformulated with the app to see whether it arrives at the same diet.'))}
  ${teoriaDe(['validacion'])}
  <div class="card"><h3>${T('Resumen de la validación','Validation summary')}${ayuda('mape')}</h3>
    <p class="small muted" style="margin-top:0">${T('Error absoluto medio entre el análisis calculado que reporta cada artículo y el que calcula la app con su matriz de ingredientes','Mean absolute error between the calculated analysis reported by each paper and the one computed by the app with its ingredient matrix')} (${VALIDACION.reduce((s,c)=>s+c.fases.length,0)} ${T('dietas de','diets from')} ${VALIDACION.length} ${T('artículos','papers')}).</p>
    <div class="kpis" style="margin:0">${Object.entries(res).map(([k,v])=>`<div class="kpi"><div class="l">${etiquetas[k]}</div><div class="v">${fmt(v.mape,1)} %</div><div class="s">${v.n} ${T('comparaciones','comparisons')} · ${T('máx.','max.')} ${fmt(v.max,1)} %</div></div>`).join('')}
      <div class="kpi"><div class="l">${T('Prueba del optimizador','Optimizer test')}${ayuda('reform')}</div><div class="v">${opt.igual} / ${opt.n}</div><div class="s">${T('fórmulas publicadas reencontradas exactamente','published formulas recovered exactly')} · ${opt.cert} ${T('con certificado','certified')}</div></div></div>
  </div>
  <div class="card prod"><h3>${T('¿Puedo confiar en RatioAvis?','Can I trust RatioAvis?')}</h3><ul class="granja">
    <li>${T(`Se reprodujeron ${VALIDACION.reduce((s,c)=>s+c.fases.length,0)} dietas de ${VALIDACION.length} artículos científicos: la energía calculada difiere en promedio <b>${fmt(res.EM.mape,1)} %</b> y la proteína <b>${fmt(res.PC.mape,1)} %</b> de lo que reportaron los investigadores.`,`${VALIDACION.reduce((s,c)=>s+c.fases.length,0)} diets from ${VALIDACION.length} scientific papers were reproduced: calculated energy differs on average by <b>${fmt(res.EM.mape,1)} %</b> and protein by <b>${fmt(res.PC.mape,1)} %</b> from what the researchers reported.`)}</li>
    <li>${T(`En <b>${opt.igual} de ${opt.n}</b> casos la app encontró exactamente la misma fórmula que publicaron los autores.`,`In <b>${opt.igual} of ${opt.n}</b> cases the app found exactly the formula the authors published.`)}</li>
    <li>${T('Su motor matemático dio el mismo resultado que un programa de referencia internacional en <b>400 pruebas</b>.','Its solver matched an international reference program in <b>400 tests</b>.')}</li></ul>
    <button class="btn ghost sm" data-vista="cien" style="margin-top:10px">${T('Ver el detalle en la vista científica','See the details in the scientist view')}</button></div>
  <div class="sci">
  <div class="card"><h3>${T('Prueba matemática del motor de cálculo','Mathematical test of the solver')}</h3>
    <p class="small" style="margin:0">${T('El método símplex de la app se comparó con un solucionador independiente de referencia (HiGHS, en SciPy 1.17) en <b>400 problemas de formulación generados al azar</b> con las 6 tablas de requerimientos y la biblioteca de ingredientes, variando requerimientos (±8 %), ingredientes disponibles y precios. Resultado: <b>350 de 350</b> problemas con solución dieron el mismo costo mínimo (diferencia relativa máxima 5×10⁻¹⁴), los <b>50</b> problemas sin solución fueron detectados como tales por ambos, y las 350 soluciones pasaron el certificado de optimalidad por dualidad.','The app’s simplex method was compared with an independent reference solver (HiGHS, in SciPy 1.17) on <b>400 randomly generated formulation problems</b> built from the 6 requirement tables and the ingredient library, varying requirements (±8 %), available ingredients and prices. Result: <b>350 of 350</b> feasible problems gave the same minimum cost (maximum relative difference 5×10⁻¹⁴), the <b>50</b> infeasible problems were flagged as such by both, and all 350 solutions passed the duality optimality certificate.')}</p></div>
  <div class="opts" style="margin-bottom:18px">${VALIDACION.map(c=>`<label class="opt ${c.id===caso.id?'sel':''}"><input type="radio" name="vcaso" value="${c.id}" ${c.id===caso.id?'checked':''}><b><span class="flag">${c.bandera}</span>${esc(c.corta)}</b><small>${esc(tx(c.pais))} · ${esc(tx(c.linea))} · AA ${c.base==='dig'?T('digestibles','digestible'):T('totales','total')}</small></label>`).join('')}</div>
  <div class="card soft small"><b>${T('Artículo','Paper')}:</b> ${esc(caso.cita)} <a href="https://doi.org/${caso.doi}" target="_blank" rel="noopener">doi:${caso.doi}</a><br><span class="muted">${esc(tx(caso.nota))}</span></div>
  ${caso.fases.map((f,i)=>{ const R = correrCaso(caso,i); return `
  <div class="card"><h3>${esc(tx(f.nombre))}</h3>
    <div class="grid g2">
      <div><h4 style="margin-top:0">${T('Fórmula publicada','Published formula')}</h4><div class="tbl"><table><thead><tr><th>${T('Ingrediente','Ingredient')}</th><th class="r">%</th></tr></thead><tbody>
        ${f.f.map(([id,p])=>`<tr><td>${esc(ingNombre(id))}</td><td class="r">${fmt(p,3)}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td class="r">${fmt(R.an.sumaPub,3)}</td></tr>${Math.abs(R.an.sumaPub-100)>0.01?`<tr><td colspan="2" class="tiny muted wrap">${T('La tabla del artículo suma','The paper’s table adds up to')} ${fmt(R.an.sumaPub,2)} %; ${T('para calcular se normalizó a 100 %.','it was normalized to 100 % for the calculations.')}</td></tr>`:''}</tbody></table></div></div>
      <div><h4 style="margin-top:0">${T('Análisis calculado: artículo vs. RatioAvis','Calculated analysis: paper vs. RatioAvis')}</h4><div class="tbl"><table><thead><tr><th>${T('Nutriente','Nutrient')}</th><th class="r">${T('Artículo','Paper')}</th><th class="r">App</th><th class="r">${T('Dif.','Diff.')}</th><th class="r">%</th></tr></thead><tbody>
        ${R.comp.map(x=>`<tr><td>${esc(tx(NUT[x.k].n))}${NUT[x.k].aa?` <span class="muted tiny">(${caso.base==='dig'?'dig.':'tot.'})</span>`:''}</td><td class="r">${fmt(x.rep,NUT[x.k].d)}</td><td class="r"><b>${fmt(x.app,NUT[x.k].d)}</b></td><td class="r">${(x.dif>=0?'+':'')+fmt(x.dif,NUT[x.k].d)}</td><td class="r">${x.excl?`<span class="badge info" title="${esc(tx(x.excl))}">${T('errata','typo')}</span>`:`<span class="badge ${colorPct(x.pct)}">${(x.pct>=0?'+':'')+fmt(x.pct,1)}</span>`}</td></tr>`).join('')}
        </tbody></table></div>
        ${R.comp.some(x=>x.excl)?`<p class="tiny muted">${R.comp.filter(x=>x.excl).map(x=>'<b>'+esc(tx(NUT[x.k].n))+':</b> '+esc(tx(x.excl))).join(' ')}</p>`:''}</div>
    </div>
    ${R.recup?pintarReform(R, f):`<p class="small muted">${T('El artículo solo reporta la proteína, así que aquí solo se compara el cálculo del aporte.','The paper only reports crude protein, so only the supply calculation is compared here.')}</p>`}
  </div>`; }).join('')}
  </div>
  ${siguiente('validacion')}`;
  $$('input[name=vcaso]',el).forEach(r=>r.addEventListener('change',()=>{ S.valCaso=r.value; guardar(); render(); }));
}
function pintarReform(R, f){
  const rB = R.recup.r, rA = R.reform.r;
  const ids = f.f.map(x=>x[0]);
  const pub = Object.fromEntries(f.f.map(([id,p])=>[id,p*100/R.an.sumaPub]));
  const nOk = R.reform.cumple.filter(x=>x.ok).length, nT = R.reform.cumple.length;
  const lineaA = rA.ok
    ? T(`Pidiendo a la app los valores <b>que reporta el artículo</b> también hay solución (${money(rA.costoKg*1000)}/t). Con la matriz de la app, la fórmula publicada cumple ${nOk} de ${nT} de esos valores; el resto de la diferencia es la matriz de ingredientes.`,`Asking the app for the values <b>reported by the paper</b> also gives a solution (${money(rA.costoKg*1000)}/t). With the app’s matrix the published formula meets ${nOk} of ${nT} of those values; the remaining difference is the ingredient matrix.`)
    : T(`Pidiendo a la app los valores <b>que reporta el artículo</b> no hay solución con estos ingredientes: con la matriz de la app la fórmula publicada solo cumple ${nOk} de ${nT} valores. Es una diferencia de matriz, no del cálculo.`,`Asking the app for the values <b>reported by the paper</b> gives no solution with these ingredients: with the app’s matrix the published formula meets only ${nOk} of ${nT} values. This is a matrix difference, not a calculation error.`);
  if(!rB.ok) return `<div class="alert warn">${T('No se pudo reformular:','Could not reformulate:')} ${esc(rB.motivo)}</div>`;
  return `<h4>${T('Prueba del optimizador: reformular con los mismos ingredientes y el mismo aporte','Optimizer test: reformulate with the same ingredients and the same supply')}${ayuda('reform')}</h4>
    <p class="small muted" style="margin-top:0">${T('Se pide a la app una dieta con, al menos, el mismo aporte que calcula para la fórmula publicada. Como la fórmula publicada ya cumple, la app debe encontrar una igual o más barata.','The app is asked for a diet supplying at least what it computes for the published formula. Since the published formula already qualifies, the app must find one that is equal or cheaper.')}</p>
    <div class="grid g2"><div class="tbl"><table><thead><tr><th>${T('Ingrediente','Ingredient')}</th><th class="r">${T('Artículo','Paper')} %</th><th class="r">App %</th><th class="r">Δ</th></tr></thead><tbody>
      ${ids.map(id=>{ const a = (rB.formula.find(x=>x.id===id)||{pct:0}).pct; return `<tr><td class="wrap">${esc(ingNombre(id))}</td><td class="r">${fmt(pub[id],2)}</td><td class="r"><b>${fmt(a,2)}</b></td><td class="r">${(a-pub[id]>=0?'+':'')+fmt(a-pub[id],2)}</td></tr>`; }).join('')}
    </tbody></table></div>
    <div><div class="kpis" style="grid-template-columns:1fr 1fr">
      <div class="kpi"><div class="l">${T('Fórmula publicada','Published formula')}</div><div class="v">${money(R.recup.costoPub*1000)}</div><div class="s">${T('por t, precios de ejemplo','per t, example prices')}</div></div>
      <div class="kpi"><div class="l">${T('Fórmula de la app','App formula')}</div><div class="v">${money(rB.costoKg*1000)}</div><div class="s">${rB.cert.ok?T('óptimo certificado','certified optimum'):''}</div></div></div>
      <div class="alert ${R.recup.ok?'ok':'bad'} small"><b>${R.recup.ok?T('✓ Correcto','✓ Correct'):T('✗ Revisar','✗ Check')}:</b> ${R.recup.igual?T('la app reencontró <b>exactamente la fórmula publicada</b> (diferencias menores a 0.005 puntos en todos los ingredientes): con esos ingredientes y ese aporte, la dieta del artículo es la de mínimo costo.','the app recovered <b>exactly the published formula</b> (differences below 0.005 points for every ingredient): with those ingredients and that supply, the paper’s diet is the least-cost one.'):R.recup.ok?T(`la app encontró una dieta con el mismo aporte que cuesta ${money((R.recup.costoPub-rB.costoKg)*1000)} menos por tonelada.`,`the app found a diet with the same supply costing ${money((R.recup.costoPub-rB.costoKg)*1000)} less per tonne.`):T('la app no igualó ni mejoró la fórmula publicada.','the app neither matched nor improved on the published formula.')}</div>
      <p class="small">${lineaA}</p></div></div>`;
}

/* ================= TEORÍA / THEORY ================= */
const TEORIA = [
 {id:'lp', b:'6', t:{es:'¿Qué es formular una dieta de mínimo costo?',en:'What is least-cost diet formulation?'}, h:{
  es:`<p>Formular es resolver un problema de <b>programación lineal</b> (Dantzig, 1947): encontrar la proporción de cada ingrediente x<sub>i</sub> (en %) que <b>minimiza el costo</b> Σ precio<sub>i</sub>·x<sub>i</sub> sujeto a:</p><ul><li>Σ x<sub>i</sub> = 100 %.</li><li>Para cada nutriente: Σ x<sub>i</sub>·nutriente<sub>i</sub> ≥ mínimo (y ≤ máximo si lo hay).</li><li>Límites de inclusión de cada ingrediente.</li></ul><p>RatioAvis usa el <b>método símplex en dos fases</b> con la regla de Bland. La fase 1 busca una dieta que cumpla todo; la fase 2 la abarata hasta que ya no se puede.</p><div class="idea"><b>Idea clave</b>La programación lineal no adivina: si existe una dieta que cumple, encuentra la más barata; si no existe, lo dice y señala qué restricción estorba.</div>`,
  en:`<p>Formulating is solving a <b>linear programming</b> problem (Dantzig, 1947): find the proportion of each ingredient x<sub>i</sub> (in %) that <b>minimizes cost</b> Σ price<sub>i</sub>·x<sub>i</sub> subject to:</p><ul><li>Σ x<sub>i</sub> = 100 %.</li><li>For each nutrient: Σ x<sub>i</sub>·nutrient<sub>i</sub> ≥ minimum (and ≤ maximum when set).</li><li>Inclusion limits for each ingredient.</li></ul><p>RatioAvis uses the <b>two-phase simplex method</b> with Bland’s rule. Phase 1 finds a diet that meets everything; phase 2 makes it cheaper until it can no longer improve.</p><div class="idea"><b>Key idea</b>Linear programming does not guess: if a feasible diet exists it finds the cheapest one; if none exists it says so and points to the conflicting constraint.</div>`}},
 {id:'lectura', b:'6', t:{es:'Cómo leer el resultado: limitantes, precios sombra y certificado',en:'Reading the result: binding constraints, shadow prices and certificate'}, h:{
  es:`<p><b>Restricción limitante:</b> el nutriente o límite que queda justo en su mínimo o máximo; determina el costo.</p><p><b>Costo marginal (precio sombra):</b> cuánto cambiaría el costo por tonelada si ese requerimiento subiera 1 %.</p><p><b>Precio de entrada:</b> para un ingrediente no usado, el precio al que empezaría a convenir.</p><p><b>Certificado de optimalidad:</b> por la teoría de la dualidad, si una dieta es factible, los precios sombra son consistentes y el costo coincide con el valor dual, ninguna otra dieta puede ser más barata. La app lo comprueba en cada formulación.</p>`,
  en:`<p><b>Binding constraint:</b> the nutrient or limit sitting exactly at its minimum or maximum; it drives the cost.</p><p><b>Marginal cost (shadow price):</b> how much the cost per tonne would change if that requirement rose by 1 %.</p><p><b>Entry price:</b> for an unused ingredient, the price at which it would start to pay off.</p><p><b>Optimality certificate:</b> by duality theory, if a diet is feasible, the shadow prices are consistent and the cost equals the dual value, no other diet can be cheaper. The app checks this every time it formulates.</p>`}},
 {id:'fuentes', b:'1', t:{es:'¿De dónde salen los requerimientos? De NRC (1994) a NASEM (2025)',en:'Where do requirements come from? From NRC (1994) to NASEM (2025)'}, h:{
  es:`<p>Durante 30 años la referencia fue el <b>NRC (1994)</b>. En <b>2025</b> las Academias Nacionales de EUA publicaron la <b>10ª edición (NASEM)</b>: aminoácidos <b>digestibles</b>, requerimientos por <b>peso corporal</b> (0–600 g, 601–1,600 g, 1,601–2,800 g, 2,801–3,600 g y 3,601–4,300 g) y modelos factoriales para lisina.</p><div class="tbl"><table><thead><tr><th>Fuente</th><th>Año</th><th>Base AA</th><th>Uso en la app</th></tr></thead><tbody><tr><td>Aviagen — Ross 308 / Arbor Acres</td><td>2022</td><td>Digestible</td><td>Tabla precargada</td></tr><tr><td>Cobb-Vantress — Cobb 500</td><td>2022</td><td>Digestible</td><td>Tabla precargada</td></tr><tr><td>Hubbard — Efficiency Plus</td><td>2022</td><td>Digestible</td><td>Tabla precargada</td></tr><tr><td>NASEM (10ª ed.)</td><td>2025</td><td>Digestible</td><td>Perfil personalizado</td></tr><tr><td>Rostagno et al. (5ª ed.)</td><td>2024</td><td>Digestible</td><td>Perfil personalizado</td></tr><tr><td>NRC (9ª ed.)</td><td>1994</td><td>Total</td><td>Referencia histórica</td></tr></tbody></table></div><div class="idea"><b>Idea clave</b>Para líneas comerciales, lo más actualizado y específico son las especificaciones de la casa genética. NASEM (2025) y las Tablas Brasileñas (2024) se capturan en el perfil personalizado.</div>`,
  en:`<p>For 30 years the reference was <b>NRC (1994)</b>. In <b>2025</b> the US National Academies published the <b>10th edition (NASEM)</b>: <b>digestible</b> amino acids, requirements by <b>body weight</b> (0–600 g, 601–1,600 g, 1,601–2,800 g, 2,801–3,600 g and 3,601–4,300 g) and factorial models for lysine.</p><div class="tbl"><table><thead><tr><th>Source</th><th>Year</th><th>AA basis</th><th>Use in the app</th></tr></thead><tbody><tr><td>Aviagen — Ross 308 / Arbor Acres</td><td>2022</td><td>Digestible</td><td>Preloaded table</td></tr><tr><td>Cobb-Vantress — Cobb 500</td><td>2022</td><td>Digestible</td><td>Preloaded table</td></tr><tr><td>Hubbard — Efficiency Plus</td><td>2022</td><td>Digestible</td><td>Preloaded table</td></tr><tr><td>NASEM (10th ed.)</td><td>2025</td><td>Digestible</td><td>Custom profile</td></tr><tr><td>Rostagno et al. (5th ed.)</td><td>2024</td><td>Digestible</td><td>Custom profile</td></tr><tr><td>NRC (9th ed.)</td><td>1994</td><td>Total</td><td>Historical reference</td></tr></tbody></table></div><div class="idea"><b>Key idea</b>For commercial lines, the breeder’s specifications are the most current and specific. NASEM (2025) and the Brazilian Tables (2024) are entered in the custom profile.</div>`}},
 {id:'genetica', b:'1', t:{es:'Genética, sexo y tipo de crecimiento',en:'Genetics, sex and growth type'}, h:{
  es:`<p>Las líneas de crecimiento rápido alcanzan 2.5–3.0 kg en 35–42 días y exigen alta densidad de aminoácidos digestibles. Las aves de <b>crecimiento lento</b> o criollas mejoradas llegan a 2.2–2.5 kg en 56 días o más, con dietas de menor energía y proteína.</p><p><b>Machos y hembras:</b> los machos crecen más rápido y convierten mejor; las hembras depositan más grasa desde la 4ª semana.</p>`,
  en:`<p>Fast-growing lines reach 2.5–3.0 kg in 35–42 days and require a high density of digestible amino acids. <b>Slow-growing</b> or improved native birds reach 2.2–2.5 kg at 56 days or later, on lower-energy, lower-protein diets.</p><p><b>Males and females:</b> males grow faster and convert better; females deposit more fat from the 4th week.</p>`}},
 {id:'energia', b:'2', t:{es:'Energía metabolizable (EMAn)',en:'Metabolizable energy (AMEn)'}, h:{
  es:`<p>La EMAn es la energía del alimento menos la perdida en heces y orina, corregida por la retención de nitrógeno. El pollo regula en parte su consumo según la energía; por eso los demás nutrientes deben guardar relación con ella. Las grasas rinden menos EM en pollitos menores de 14 días.</p>`,
  en:`<p>AMEn is feed energy minus the energy lost in excreta, corrected for nitrogen retention. Broilers partly regulate intake by energy, so the other nutrients must keep a ratio to it. Fats yield less ME in chicks younger than 14 days.</p>`}},
 {id:'proteina', b:'2', t:{es:'Proteína ideal y aminoácidos digestibles',en:'Ideal protein and digestible amino acids'}, h:{
  es:`<p>La <b>proteína ideal</b> expresa cada aminoácido esencial como porcentaje de la lisina (= 100). Formular con aminoácidos sintéticos permite bajar la proteína cruda sin afectar el crecimiento y reduce la excreción de nitrógeno.</p><div class="tbl"><table><thead><tr><th>AA digestible</th><th class="r">Iniciación</th><th class="r">Finalización</th></tr></thead><tbody><tr><td>Lisina</td><td class="r">100</td><td class="r">100</td></tr><tr><td>Met + Cis</td><td class="r">74–76</td><td class="r">78–80</td></tr><tr><td>Treonina</td><td class="r">65–67</td><td class="r">66–67</td></tr><tr><td>Triptófano</td><td class="r">16</td><td class="r">16–17</td></tr><tr><td>Arginina</td><td class="r">105–107</td><td class="r">108–110</td></tr><tr><td>Isoleucina</td><td class="r">67</td><td class="r">69</td></tr><tr><td>Valina</td><td class="r">76</td><td class="r">78</td></tr></tbody></table></div><p class="small muted">Relaciones calculadas de Aviagen (2022).</p>`,
  en:`<p><b>Ideal protein</b> expresses each essential amino acid as a percentage of lysine (= 100). Formulating with synthetic amino acids lowers crude protein without hurting growth and reduces nitrogen excretion.</p><div class="tbl"><table><thead><tr><th>Digestible AA</th><th class="r">Starter</th><th class="r">Finisher</th></tr></thead><tbody><tr><td>Lysine</td><td class="r">100</td><td class="r">100</td></tr><tr><td>Met + Cys</td><td class="r">74–76</td><td class="r">78–80</td></tr><tr><td>Threonine</td><td class="r">65–67</td><td class="r">66–67</td></tr><tr><td>Tryptophan</td><td class="r">16</td><td class="r">16–17</td></tr><tr><td>Arginine</td><td class="r">105–107</td><td class="r">108–110</td></tr><tr><td>Isoleucine</td><td class="r">67</td><td class="r">69</td></tr><tr><td>Valine</td><td class="r">76</td><td class="r">78</td></tr></tbody></table></div><p class="small muted">Ratios calculated from Aviagen (2022).</p>`}},
 {id:'minerales', b:'2', t:{es:'Calcio, fósforo y fitasa',en:'Calcium, phosphorus and phytase'}, h:{
  es:`<p>Ca y P disponible se formulan con relación Ca:Pd ≈ 1.8–2.1:1. El exceso de Ca reduce la absorción de P, Zn y Mn. La <b>fitasa</b> libera 0.10–0.15 % de P del fitato; se captura como ingrediente con la matriz del fabricante.</p>`,
  en:`<p>Ca and available P are formulated at a Ca:avP ratio of ≈1.8–2.1:1. Excess Ca impairs absorption of P, Zn and Mn. <b>Phytase</b> releases 0.10–0.15 % P from phytate; enter it as an ingredient with the manufacturer’s matrix.</p>`}},
 {id:'ambiente', b:'3', t:{es:'Altitud, calor y balance electrolítico',en:'Altitude, heat and electrolyte balance'}, h:{
  es:`<p><b>Balance electrolítico (DEB, Mongin 1981):</b> Na%·10000/23 + K%·10000/39.1 − Cl%·10000/35.45 (mEq/kg). El óptimo ronda 250 mEq/kg.</p><p><b>Síndrome ascítico:</b> frecuente por encima de 1,500–2,000 msnm por hipoxia y alta demanda de oxígeno del crecimiento rápido.</p>`,
  en:`<p><b>Dietary electrolyte balance (DEB, Mongin 1981):</b> Na%·10000/23 + K%·10000/39.1 − Cl%·10000/35.45 (mEq/kg). The optimum is around 250 mEq/kg.</p><p><b>Ascites syndrome:</b> common above 1,500–2,000 m a.s.l. because of hypoxia and the high oxygen demand of fast growth.</p>`}},
 {id:'pigmento', b:'3', t:{es:'Pigmentación de la piel',en:'Skin pigmentation'}, h:{
  es:`<p>En varias regiones de México se prefiere el pollo amarillo. Las xantofilas del maíz, el gluten de maíz y la flor de cempasúchil se depositan en piel y grasa; el programa se concentra en las últimas 2–3 semanas.</p>`,
  en:`<p>Several markets (e.g. Mexico) prefer yellow-skinned broilers. Xanthophylls from corn, corn gluten meal and marigold flowers are deposited in skin and fat; pigmentation is concentrated in the last 2–3 weeks.</p>`}},
 {id:'ingredientes', b:'4', t:{es:'La matriz de ingredientes',en:'The ingredient matrix'}, h:{
  es:`<p>Cada ingrediente tiene una composición (matriz). Los valores precargados provienen de Rostagno et al. (2017), FEDNA (2019) y NRC (1994). La digestibilidad ileal estandarizada indica cuánto aminoácido se absorbe realmente.</p><div class="idea"><b>Idea clave</b>La proteína del sorgo, los DDGS o las harinas animales varía mucho entre lotes: un análisis de laboratorio mejora más la dieta que cualquier ajuste de requerimientos.</div>`,
  en:`<p>Each ingredient has a composition (matrix). Preloaded values come from Rostagno et al. (2017), FEDNA (2019) and NRC (1994). Standardized ileal digestibility tells how much of each amino acid is actually absorbed.</p><div class="idea"><b>Key idea</b>Protein in sorghum, DDGS or animal meals varies widely between batches: a laboratory analysis improves a diet more than any requirement tweak.</div>`}},
 {id:'limites', b:'5', t:{es:'Límites de inclusión',en:'Inclusion limits'}, h:{
  es:`<p>Se basan en antinutrientes (glucosinolatos, polisacáridos no amiláceos, taninos), variabilidad y riesgo sanitario (harinas animales, DDGS), calidad de canal (harina de pescado) y calidad física (grasas &gt; 5–6 % dificultan el peletizado). Orientativos: DDGS 5–8 % en iniciación y 10–12 % en finalización; canola 5–10 %; harina de carne y hueso 3–6 %; pescado ≤ 3–5 %; trigo 30–40 % con enzima.</p>`,
  en:`<p>They reflect antinutrients (glucosinolates, non-starch polysaccharides, tannins), variability and safety risk (animal meals, DDGS), carcass quality (fish meal) and physical quality (fat &gt; 5–6 % hampers pelleting). Guidelines: DDGS 5–8 % in starter and 10–12 % in finisher; canola 5–10 %; meat and bone meal 3–6 %; fish meal ≤ 3–5 %; wheat 30–40 % with enzyme.</p>`}},
 {id:'multifase', b:'7', t:{es:'Formular varias fases a la vez',en:'Formulating several phases at once'}, h:{
  es:`<p>Un <b>programa de alimentación</b> es la secuencia de dietas que recibe el ave. Formular todas las fases a la vez muestra el <b>costo total de alimento por ave</b> y por <b>kg de peso vivo</b>, que es lo que realmente importa económicamente. Más fases ajustan mejor la dieta a la necesidad real, pero complican la logística de la planta.</p><div class="idea"><b>Idea clave</b>La fase más cara por tonelada suele ser la iniciación, pero la que más pesa en el costo por ave es la finalización: ahí se consume más del 60 % del alimento.</div>`,
  en:`<p>A <b>feeding program</b> is the sequence of diets a bird receives. Formulating every phase at once shows the <b>total feed cost per bird</b> and per <b>kg of live weight</b>, which is what really matters economically. More phases match the diet better to real needs but complicate feed-mill logistics.</p><div class="idea"><b>Key idea</b>The starter is usually the most expensive feed per tonne, but the finisher weighs most on cost per bird: it accounts for over 60 % of the feed eaten.</div>`}},
 {id:'validacion', b:'✓', t:{es:'¿Cómo se valida un formulador?',en:'How is a formulation tool validated?'}, h:{
  es:`<ol><li><b>Cálculo del aporte:</b> introducir fórmulas publicadas y comparar el análisis calculado con el que reportan los autores. Las diferencias vienen de la matriz de ingredientes, no del cálculo.</li><li><b>Optimización:</b> reformular con los mismos ingredientes y el mismo aporte; la app debe reencontrar la dieta o una más barata.</li><li><b>Matemática:</b> comparar con un solucionador independiente y verificar el certificado de dualidad.</li></ol><p>Diferencias de ±3 % en EM y PC son normales entre tablas de composición; en aminoácidos, de ±5–10 %.</p>`,
  en:`<ol><li><b>Supply calculation:</b> enter published formulas and compare the calculated analysis with the authors’ values. Differences come from the ingredient matrix, not the calculation.</li><li><b>Optimization:</b> reformulate with the same ingredients and supply; the app must recover the diet or a cheaper one.</li><li><b>Mathematics:</b> compare against an independent solver and verify the duality certificate.</li></ol><p>Differences of ±3 % in ME and CP are normal between composition tables; ±5–10 % for amino acids.</p>`}},
 {id:'errores', b:'', t:{es:'Errores frecuentes al formular',en:'Common formulation mistakes'}, h:{
  es:`<ul><li>Mezclar requerimientos digestibles con matriz en aminoácidos totales.</li><li>Usar la EM de la grasa para adultos en dietas de iniciación.</li><li>Olvidar el Ca de la harina de carne o del fosfato.</li><li>No limitar ingredientes variables (DDGS, harinas animales).</li><li>Confiar en la tabla y no analizar los ingredientes.</li><li>Dejar el sodio sin máximo: sube el consumo de agua y la cama se humedece.</li></ul>`,
  en:`<ul><li>Mixing digestible requirements with a total amino-acid matrix.</li><li>Using adult-bird fat ME values in starter diets.</li><li>Forgetting the Ca supplied by meat meal or phosphate.</li><li>Not limiting variable ingredients (DDGS, animal meals).</li><li>Trusting tables without analyzing ingredients.</li><li>Leaving sodium without a maximum: water intake rises and litter gets wet.</li></ul>`}}
];
const CONSEJO = {
  fuentes:{es:'Elige la línea que realmente tienes en la granja y el sexo de tus aves. Con eso la app carga lo que recomienda la casa genética.',en:'Choose the line you actually house and the sex of your birds. The app then loads what the breeding company recommends.'},
  energia:{es:'Escoge la etapa según la edad de tus pollos. Los valores ya vienen de la tabla; cámbialos solo si tu nutriólogo lo indica. Anota cuánto comen y cuánto ganan tus aves para conocer el costo por pollo.',en:'Pick the phase by the age of your birds. Values come from the table; change them only if your nutritionist says so. Enter how much your birds eat and gain to know the cost per bird.'},
  ambiente:{es:'Si tu granja está a mucha altura o hace calor, aquí te decimos qué ajustar. Nada cambia hasta que tú presionas el botón.',en:'If your farm is at high altitude or it is hot, here you see what to adjust. Nothing changes until you press the button.'},
  ingredientes:{es:'Marca solo lo que puedes comprar en tu región. Mientras más opciones tengas, más barata puede salir la dieta.',en:'Tick only what you can buy in your region. The more options, the cheaper the diet can be.'},
  limites:{es:'Escribe el precio que pagas puesto en tu granja (con flete). Los límites evitan usar demasiado de un ingrediente riesgoso o difícil de mezclar.',en:'Enter the price you pay delivered to your farm (freight included). Limits avoid too much of a risky or hard-to-mix ingredient.'},
  lp:{es:'Presiona Formular: la app prueba todas las combinaciones posibles y te entrega la más barata que cubre lo que tus pollos necesitan, con su hoja de mezclado.',en:'Press Formulate: the app tries every possible combination and gives you the cheapest one that covers what your birds need, with its mixing sheet.'},
  multifase:{es:'Formula todas las etapas de una vez y conoce cuánto te cuesta alimentar a cada pollo hasta la venta.',en:'Formulate every phase at once and see what it costs to feed each bird up to market.'},
  validacion:{es:'RatioAvis se comparó con dietas publicadas por investigadores y con un programa matemático de referencia, y dio los mismos resultados. Puedes confiar en sus cálculos.',en:'RatioAvis was checked against diets published by researchers and a reference mathematical solver, with matching results. You can trust its calculations.'}
};
function teoriaDe(ids){
  const c = CONSEJO[ids[0]];
  return `${c?`<div class="consejo prod">${ill('i-prod')}<div><div class="k">${T('En pocas palabras','In a nutshell')}</div><p>${esc(tx(c))}</p></div></div>`:''}` + teoriaSci(ids);
}
function teoriaSci(ids){
  const items = TEORIA.filter(t=>ids.includes(t.id));
  return `<section class="teoria sci"><div class="th"><div><h2>${T('Marco teórico','Theoretical framework')}</h2><p>${T('Lo que conviene tener claro antes de decidir. Despliega la sección que necesites.','What to keep in mind before deciding. Open the section you need.')}</p></div><button class="btn ghost sm" data-ir="teoria">${T('Ver todo','See all')}</button></div>
    ${items.map(t=>`<details><summary>${TEORIA.indexOf(t)+1} · ${esc(tx(t.t))}</summary><div class="tb">${tx(t.h)}</div></details>`).join('')}</section>`;
}
function renderTeoria(el){
  el.innerHTML = `${cabecera('teoria',T('Todo lo que conviene tener claro para formular bien. Cada sección indica el bloque donde se aplica.','Everything worth knowing to formulate well. Each section shows the block where it applies.'))}
  <section class="teoria"><div class="th"><div><h2>${T('Marco teórico de la formulación de dietas para pollo de engorda','Theoretical framework of broiler diet formulation')}</h2><p>${T('Despliega la sección que necesites.','Open the section you need.')}</p></div></div>
  ${TEORIA.map((t,i)=>`<details ${i===0?'open':''}><summary>${i+1} · ${esc(tx(t.t))} ${t.b?`<span class="badge">${T('Bloque','Block')} ${t.b}</span>`:''}</summary><div class="tb">${tx(t.h)}</div></details>`).join('')}</section>
  <div class="card small"><h3>${T('Referencias','References')}</h3><ul>
    <li>Aviagen. (2022). <i>Ross broiler nutrition specifications</i>; <i>Arbor Acres broiler nutrition specifications</i>. Aviagen.</li>
    <li>Cobb-Vantress. (2022). <i>Cobb500 broiler performance &amp; nutrition supplement</i>. Cobb-Vantress.</li>
    <li>Dantzig, G. B. (1963). <i>Linear programming and extensions</i>. Princeton University Press.</li>
    <li>FEDNA. (2019). <i>Tablas FEDNA de composición y valor nutritivo de alimentos</i> (4ª ed.). FEDNA.</li>
    <li>Hubbard. (2022). <i>Efficiency Plus broiler guide and nutrient specifications</i>. Hubbard.</li>
    <li>Klasing, K. C., et al. (2025). Overview of the nutrient requirements of poultry, 10th revised edition. <i>Journal of Applied Poultry Research, 34</i>, 100616.</li>
    <li>Leeson, S., &amp; Summers, J. D. (2005). <i>Commercial poultry nutrition</i> (3rd ed.). University Books.</li>
    <li>Mongin, P. (1981). Recent advances in dietary anion-cation balance: Applications in poultry. <i>Proceedings of the Nutrition Society, 40</i>, 285–294.</li>
    <li>National Academies of Sciences, Engineering, and Medicine. (2025). <i>Nutrient requirements of poultry</i> (10th rev. ed.). The National Academies Press. https://doi.org/10.17226/25395</li>
    <li>National Research Council. (1994). <i>Nutrient requirements of poultry</i> (9th rev. ed.). National Academy Press.</li>
    <li>Rostagno, H. S., et al. (2017; 2024). <i>Tabelas brasileiras para aves e suínos</i> (4ª y 5ª ed.). UFV.</li>
    <li>Usturoi, M. G., et al. (2023). Impact of different levels of crude protein on production performance and meat quality in broiler selected for slow growth. <i>Agriculture, 13</i>, 427.</li>
  </ul></div>
  ${siguiente('teoria')}`;
}

/* =====================================================================
   9. NAVEGACIÓN, IDIOMA Y TEMA / NAVIGATION, LANGUAGE AND THEME
   ===================================================================== */
function renderNav(){
  $('#nav').innerHTML = BLOQUES.map(b=>`<button class="${S.bloque===b.id?'act':''} ${S.visitados[b.id]&&S.bloque!==b.id&&/^\d$/.test(b.n)?'done':''}" data-ir="${b.id}"><span class="n">${b.n}</span>${esc(tx(b.corto))}</button>`).join('');
  const a = $('#nav .act'); if(a && a.scrollIntoView) a.scrollIntoView({block:'nearest',inline:'center'});
  const hechos = BLOQUES.filter(b=>/^\d$/.test(b.n) && (S.visitados[b.id]||S.bloque===b.id)).length;
  $('#progTxt').textContent = T(`Avance: ${hechos} de ${NUMERADOS} bloques`,`Progress: ${hechos} of ${NUMERADOS} blocks`);
  $('#progFill').style.width = (100*hechos/NUMERADOS)+'%';
}
function actualizarPill(){
  const g = GENETICAS[S.genetica], f = (fasesDe(S.genetica)||[])[S.fase];
  const t = $('#pillTxt'); if(t) t.textContent = `${tx(g.nombre)} · ${f?tx(f.nombre):''}` + (S.resultado&&S.resultado.ok?` · ${money(S.resultado.costoKg*1000)}/t`:'');
}
function renderAyuda(){
  $('#dlgAyuda').innerHTML = `<div class="dh"><h2>${T('Cómo usar RatioAvis','How to use RatioAvis')}</h2><button class="ibtn round" onclick="this.closest('dialog').close()" aria-label="×">✕</button></div>
  <div class="db"><ol>
    <li>${T('<b>Avanza en orden</b> por los bloques de la barra superior. Cada bloque es una entrada: genética, etapa, condiciones, ingredientes, precios.','<b>Move in order</b> through the blocks in the top bar. Each block is an input: genetics, phase, conditions, ingredients, prices.')}</li>
    <li>${T('En <b>Formulación</b> presiona <i>Formular</i>: se calcula la dieta de mínimo costo que cumple todo.','In <b>Formulation</b> press <i>Formulate</i>: the least-cost diet meeting every requirement is computed.')}</li>
    <li>${T('En <b>Programa</b> formulas todas las fases de una vez y ves el costo total por ave.','In <b>Program</b> you formulate every phase at once and see the total cost per bird.')}</li>
    <li>${T('En <b>Validación</b> ves cómo la app reproduce dietas publicadas en revistas científicas.','In <b>Validation</b> you see how the app reproduces diets published in scientific journals.')}</li>
    <li>${T('El botón <b>Productor / Científico</b> cambia la vista: la de productor muestra lo esencial en lenguaje sencillo (con hoja de mezclado); la científica muestra el modelo completo, los precios sombra, la validación y las referencias.','The <b>Producer / Scientist</b> button switches the view: the producer view shows the essentials in plain language (with a mixing sheet); the scientist view shows the full model, shadow prices, validation and references.')}</li>
    <li>${T('El botón <b>ES / EN</b> cambia el idioma en cualquier momento sin perder tus datos.','The <b>ES / EN</b> button switches language at any time without losing your data.')}</li>
    <li>${T('Tu trabajo se <b>guarda solo</b> en este navegador. Para llevarlo a otra computadora usa <i>Informe → Guardar proyecto</i>.','Your work is <b>saved automatically</b> in this browser. To take it to another computer use <i>Report → Save project</i>.')}</li>
  </ol><p class="small muted">${T('Los valores precargados son de referencia. Verifica con el manual vigente de tu línea genética y con los análisis de tus ingredientes.','Preloaded values are references. Check them against your line’s current manual and your ingredient analyses.')}</p></div>`;
}
function render(){
  document.documentElement.lang = LANG;
  $$('.langsw button[data-lang]').forEach(b=>b.classList.toggle('on', b.dataset.lang===LANG));
  document.documentElement.setAttribute('data-modo', MODO);
  $$('.modesw button').forEach(b=>{ const on=b.dataset.vista===MODO; b.classList.toggle('on',on); b.setAttribute('aria-pressed', on); });
  $('#lblProd').textContent = T('Productor','Producer'); $('#lblCien').textContent = T('Científico','Scientist');
  $('#modesw').title = T('Vista para productor o para científico','Producer or scientist view');
  $('#brandSub').textContent = T('· la razón al servicio del ave','· reason in the service of the bird');
  const b = B(S.bloque) || BLOQUES[0];
  b.render()($('#main'));
  $('#pie').innerHTML = `<svg style="width:26px;height:26px;vertical-align:middle;margin-right:6px"><use href="#i-logo" width="100%" height="100%"/></svg><b>RatioAvis</b> ${CONFIG.version} · ${T('Formulación de dietas para pollo de engorda','Broiler diet formulation')} · ${esc(CONFIG.autores)} · ${CONFIG.anio}<br><span class="tiny">${T('Herramienta de apoyo: los resultados deben ser revisados por un profesional en nutrición animal.','Decision-support tool: results should be reviewed by a qualified animal nutritionist.')} · MIT</span>`;
  renderNav(); actualizarPill(); renderAyuda();
}
function irA(id){ S.visitados[S.bloque]=true; S.bloque=id; guardar(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-ir]'); if(t){ irA(t.dataset.ir); } });
function ponerModo(m){ MODO = m==='cien'?'cien':'prod'; try{ localStorage.setItem('ratioavis_modo',MODO); }catch(e){} render();
  toast(MODO==='cien'?T('Vista científica: modelo, duales, validación y referencias','Scientist view: model, duals, validation and references'):T('Vista productor: lo esencial, en lenguaje sencillo','Producer view: the essentials, in plain language')); }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-vista]'); if(t){ ponerModo(t.dataset.vista); } });
$$('.langsw button[data-lang]').forEach(b=>b.addEventListener('click',()=>{ LANG=b.dataset.lang; try{ localStorage.setItem('ratioavis_lang',LANG); }catch(e){} render(); toast(LANG==='en'?'English':'Español'); }));
function aplicarTema(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme');
  const dark = t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; $('#btnTema').textContent = dark?'☾':'☀'; }
$('#btnTema').addEventListener('click',()=>{ const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nt = cur==='dark'?'light':'dark'; aplicarTema(nt); try{ localStorage.setItem('ratioavis_tema',nt); }catch(e){} });
$('#btnAyuda').addEventListener('click',()=>{ const d=$('#dlgAyuda'); if(d.showModal) d.showModal(); });
try{ aplicarTema(localStorage.getItem('ratioavis_tema')); }catch(e){ aplicarTema(null); }

S = cargar();
render();
</script>
</body>
</html>
