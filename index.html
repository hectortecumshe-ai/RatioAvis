<style>
:root{
  color-scheme: light;
  --bg:#f6f5f0; --bg-soft:#ecebe3; --card:#ffffff; --text:#1d2420; --muted:#5a645e;
  --border:#e0ded4; --border-strong:#c3c1b3; --field:#8a8f86;
  --primary-rgb:47,93,80; --primary:#2f5d50; --primary-dark:#21453b; --primary-soft:rgba(var(--primary-rgb),.09);
  --on-primary:#ffffff;
  --accent-rgb:192,119,43; --accent:#c0772b; --accent-soft:rgba(var(--accent-rgb),.13); --accent-text:#8a5214;
  --ok:#2f8f4a; --ok-text:#1d6b34; --ok-soft:#e7f5eb;
  --warn:#c27c0e; --warn-text:#8a5300; --warn-soft:#fdf3e1;
  --bad:#c43a2f; --bad-text:#a82c22; --bad-soft:#fbe9e7;
  --info:#2d78b0; --info-text:#1f5f91; --info-soft:#e6f0f8;
  --font:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",P052,"TeX Gyre Pagella",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --shadow-sm:0 1px 2px rgba(30,36,24,.06);
  --shadow:0 1px 2px rgba(30,36,24,.05),0 8px 24px rgba(30,36,24,.07);
  --shadow-lg:0 4px 10px rgba(30,36,24,.08),0 20px 48px rgba(30,36,24,.14);
  --ease:cubic-bezier(.2,.7,.2,1); --max:1200px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11150f; --bg-soft:#191e17; --card:#1d241f; --text:#e9ede6; --muted:#a9b3a8;
    --border:#2c362e; --border-strong:#3f4b41; --field:#708071;
    --primary-rgb:131,196,172; --primary:#83c4ac; --primary-dark:#b2dccb; --on-primary:#0f1512;
    --accent-rgb:236,172,98; --accent:#ecac62; --accent-text:#f2c48c;
    --ok:#5cc27a; --ok-text:#7fd497; --ok-soft:rgba(92,194,122,.13);
    --warn:#f0b24a; --warn-text:#f5c56f; --warn-soft:rgba(240,178,74,.13);
    --bad:#f07166; --bad-text:#f59189; --bad-soft:rgba(240,113,102,.13);
    --info:#69b2e0; --info-text:#8cc6ea; --info-soft:rgba(105,178,224,.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,.45); --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.34); --shadow-lg:0 4px 10px rgba(0,0,0,.5),0 20px 48px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11150f; --bg-soft:#191e17; --card:#1d241f; --text:#e9ede6; --muted:#a9b3a8;
  --border:#2c362e; --border-strong:#3f4b41; --field:#708071;
  --primary-rgb:131,196,172; --primary:#83c4ac; --primary-dark:#b2dccb; --on-primary:#0f1512;
  --accent-rgb:236,172,98; --accent:#ecac62; --accent-text:#f2c48c;
  --ok:#5cc27a; --ok-text:#7fd497; --ok-soft:rgba(92,194,122,.13);
  --warn:#f0b24a; --warn-text:#f5c56f; --warn-soft:rgba(240,178,74,.13);
  --bad:#f07166; --bad-text:#f59189; --bad-soft:rgba(240,113,102,.13);
  --info:#69b2e0; --info-text:#8cc6ea; --info-soft:rgba(105,178,224,.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,.45); --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.34); --shadow-lg:0 4px 10px rgba(0,0,0,.5),0 20px 48px rgba(0,0,0,.5);
}
*,::before,::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);font-size:16.5px;line-height:1.6;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{line-height:1.2;text-wrap:balance;font-weight:700}
a{color:var(--primary-dark);text-underline-offset:2px}
::selection{background:rgba(var(--primary-rgb),.22)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-sm)}
button,input,select,textarea{font-family:inherit}

/* ---------- barra superior ---------- */
.bar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.bar-top{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px 6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);cursor:pointer;border:0;background:none;padding:0}
.brand-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:var(--shadow-sm)}
.brand-ico svg{width:22px;height:22px}
.brand-name{font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand-name b{color:var(--accent)}
.brand-sub{font-size:13px;color:var(--muted);font-style:italic}
.bar-top .sp{flex:1}
.ibtn{height:36px;min-width:36px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--card);color:var(--text);display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;font-weight:600}
.ibtn:hover{border-color:var(--primary);color:var(--primary-dark)}
.ibtn.round{padding:0;width:36px;justify-content:center}
.steps-nav{max-width:var(--max);margin:0 auto;display:flex;gap:4px;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:thin}
.steps-nav button{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:none;color:var(--muted);padding:5px 11px 5px 6px;border-radius:var(--r-pill);font-size:14.5px;cursor:pointer;white-space:nowrap}
.steps-nav button:hover{color:var(--text);background:var(--primary-soft)}
.steps-nav .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--bg-soft);color:var(--muted);border:1px solid var(--border)}
.steps-nav button.act{background:var(--primary-soft);border-color:rgba(var(--primary-rgb),.35);color:var(--primary-dark);font-weight:700}
.steps-nav button.act .n{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.steps-nav button.done .n{background:var(--ok-soft);color:var(--ok-text);border-color:transparent}

/* ---------- contenido ---------- */
main{max-width:var(--max);margin:0 auto;padding:26px 20px 40px;min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--primary-dark)}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--primary)}
.bhead{margin:0 0 18px}
.bhead h1{font-size:clamp(1.7rem,1.2rem + 2vw,2.35rem);margin:6px 0 8px;letter-spacing:-.015em}
.lead{color:var(--muted);margin:0;max-width:78ch;font-size:17px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px;margin:0 0 18px;box-shadow:var(--shadow-sm)}
.card>h2,.card>h3,.card .ch{margin:0 0 12px;font-size:19px}
.card h4{margin:16px 0 8px;font-size:15.5px}
.card.soft{background:var(--bg-soft);box-shadow:none}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
label.f .h{font-size:12.5px;font-style:italic}
input,select,textarea{font-size:15px;color:var(--text);background:var(--card);border:1px solid var(--field);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:transparent}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--primary)}
input.num{text-align:right;max-width:112px;padding:5px 8px;font-variant-numeric:tabular-nums}
input:disabled{background:var(--bg-soft);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);border-radius:var(--r-md);padding:9px 18px;font-size:15.5px;font-weight:700;cursor:pointer;text-decoration:none;transition:background .15s var(--ease),transform .15s var(--ease)}
.btn:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--text);border-color:var(--border-strong)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary-dark);background:var(--card)}
.btn.link{background:none;border-color:transparent;color:var(--primary-dark);padding-left:6px;padding-right:6px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 11px;font-size:14px;font-weight:600}
.btn.lg{padding:13px 24px;font-size:17px}
.btn.danger{background:none;color:var(--bad-text);border-color:var(--bad)}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.opt{position:relative;border:1.5px solid var(--border);border-radius:var(--r-md);padding:13px 15px;cursor:pointer;background:var(--card);display:block;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:var(--primary);box-shadow:var(--shadow-sm)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel::after{content:"✓";position:absolute;top:10px;right:12px;width:20px;height:20px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:12px;display:grid;place-items:center;font-weight:700}
.opt b{display:block;font-size:16.5px;margin-bottom:2px;padding-right:24px}
.opt small{color:var(--muted);font-size:13.5px;line-height:1.45;display:block}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .badge{margin-top:6px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:2px 9px;border-radius:var(--r-pill);background:var(--bg-soft);color:var(--muted);border:1px solid var(--border)}
.badge.ok{background:var(--ok-soft);color:var(--ok-text);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn-text);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad-text);border-color:transparent}
.badge.info{background:var(--info-soft);color:var(--info-text);border-color:transparent}
.badge.pri{background:var(--primary-soft);color:var(--primary-dark);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-md);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 11px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{background:var(--bg-soft);color:var(--text);font-weight:700;font-size:13.5px;position:sticky;top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;background:var(--bg-soft)}
tbody tr:hover td{background:color-mix(in srgb,var(--primary-soft) 60%,transparent)}
tr.cat td{background:var(--bg);font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.wrap{white-space:normal}
.alert{border-radius:var(--r-md);padding:13px 16px;margin:0 0 16px;border:1px solid;border-left-width:4px}
.alert p{margin:4px 0}
.alert ul{margin:6px 0 0;padding-left:22px}
.alert.info{background:var(--info-soft);border-color:var(--info)}
.alert.ok{background:var(--ok-soft);border-color:var(--ok)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)}
.idea{background:var(--bg-soft);border-left:4px solid var(--primary);border-radius:0 var(--r-md) var(--r-md) 0;padding:11px 16px;margin:12px 0}
.idea b:first-child{display:block;color:var(--primary-dark)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));margin:0 0 18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 15px;box-shadow:var(--shadow-sm)}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;color:var(--primary-dark)}
.kpi .s{font-size:13px;color:var(--muted)}
.bar-h{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--primary),color-mix(in srgb,var(--primary) 70%,var(--accent)));min-width:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 12px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--border);color:var(--text)}
.next{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}
.next .btn.big-next{flex-direction:column;align-items:flex-end;gap:0;padding:10px 20px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border:0;box-shadow:var(--shadow)}
.next .big-next small{font-size:12px;font-weight:500;opacity:.85}
.next .big-next span{font-size:16.5px}
code{font-family:var(--mono);background:var(--bg-soft);padding:1px 6px;border-radius:5px;font-size:.86em}
.hide{display:none!important}

/* ---------- teoría (acordeón numerado) ---------- */
.teoria{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:6px 22px 10px;margin:0 0 18px;box-shadow:var(--shadow-sm);border-top:4px solid var(--primary)}
.teoria>.th{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 0 6px}
.teoria>.th h2{margin:0;font-size:20px}
.teoria>.th p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.teoria details{border-bottom:1px solid var(--border)}
.teoria details:last-child{border-bottom:0}
.teoria summary{cursor:pointer;list-style:none;padding:12px 0;font-weight:600;display:flex;gap:10px;align-items:center}
.teoria summary::-webkit-details-marker{display:none}
.teoria summary::before{content:"▸";color:var(--muted);transition:transform .15s;display:inline-block}
.teoria details[open] summary::before{transform:rotate(90deg)}
.teoria details[open] summary{color:var(--primary-dark)}
.teoria .tb{padding:0 0 14px 22px;max-width:92ch}
.teoria .tb p,.teoria .tb li{margin:6px 0}
.teoria .tb table{font-size:14px;margin:8px 0}

/* ---------- inicio ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--border);background:
  radial-gradient(1200px 400px at 110% -10%,rgba(var(--accent-rgb),.14),transparent 60%),
  radial-gradient(900px 500px at -10% 120%,rgba(var(--primary-rgb),.13),transparent 60%),var(--card);
  padding:clamp(22px,4vw,48px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(2.1rem,1.3rem + 3.3vw,3.4rem);line-height:1.08;margin:14px 0 16px;letter-spacing:-.02em}
.hero h1 em{font-style:italic;color:var(--primary)}
.hero h1 .acc{color:var(--accent)}
.hero p.big{font-size:18.5px;color:var(--muted);margin:0 0 22px;max-width:56ch}
.hero p.big b{color:var(--text)}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.illus{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.illus .ic{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow-sm)}
.illus .ic.wide{grid-column:1/-1}
.illus .ic .t{font-size:12px;color:var(--muted);margin-bottom:4px}
.illus svg{width:100%;height:auto;display:block}
.section-t{margin:40px 0 4px;font-size:26px}
.section-l{margin:0 0 16px;color:var(--muted)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);overflow:hidden}
.howto div{padding:14px 16px;border-right:1px solid var(--border)}
.howto div:last-child{border-right:0}
.howto .k{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--primary-dark)}
.howto b{display:block;margin:2px 0 4px}
.howto span{font-size:13.5px;color:var(--muted);line-height:1.4;display:block}
.inc{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.inc button{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-sm);display:flex;gap:14px;align-items:flex-start;transition:border-color .15s,transform .15s}
.inc button:hover{border-color:var(--primary);transform:translateY(-2px)}
.inc .num{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-dark);font-weight:700}
.inc h3{margin:2px 0 4px;font-size:18px}
.inc p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}
.why{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 26px;margin-top:36px}
.why h3{margin:0 0 8px;font-size:19px}
.why .cite{font-size:14px;color:var(--muted)}
.why .cite .k{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--primary-dark);margin-bottom:8px}
footer.pie{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 20px 40px;border-top:1px solid var(--border);margin-top:20px}

/* ---------- ayuda ---------- */
dialog{border:1px solid var(--border);border-radius:var(--r-lg);padding:0;max-width:640px;width:calc(100% - 32px);background:var(--card);color:var(--text);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(10,14,10,.45)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
dialog .dh h2{margin:0;font-size:20px}
dialog .db{padding:10px 22px 20px}

@media (max-width:900px){
  .hero,.why{grid-template-columns:minmax(0,1fr)}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .howto div{border-right:0;border-bottom:1px solid var(--border)}
}
@media (max-width:600px){
  body{font-size:16px}
  main{padding:18px 16px 30px}
  .bar-top{padding:8px 16px 4px}
  .brand-sub,.ibtn .lbl{display:none}
  .illus{grid-template-columns:1fr}
  .card{padding:16px}
  .teoria{padding:4px 16px 8px}
}
@media print{
  .bar,.next,.no-print,.teoria,footer.pie{display:none!important}
  body{background:#fff;color:#000;font-size:12pt}
  .card{box-shadow:none;break-inside:avoid;border-color:#bbb}
  main{max-width:none;padding:0}
}
/* ================= RatioAvis · capa visual adicional ================= */
.brand-ico{background:none;box-shadow:none;width:40px;height:40px}
.brand-ico svg{width:40px;height:40px}
.brand-name{font-size:22px}
.brand-name i{font-style:italic;color:var(--accent)}
.langsw{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-pill);padding:3px;background:var(--card)}
.langsw button{border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:5px 12px;border-radius:var(--r-pill);cursor:pointer;font-family:inherit;letter-spacing:.04em}
.langsw button.on{background:var(--primary);color:var(--on-primary)}
.progress{max-width:var(--max);margin:0 auto;padding:0 20px 8px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.progress .track{flex:1;height:4px;border-radius:4px;background:var(--bg-soft);overflow:hidden}
.progress .fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;transition:width .5s var(--ease)}
main>*{animation:subir .45s var(--ease) both}
main>*:nth-child(2){animation-delay:.04s} main>*:nth-child(3){animation-delay:.08s} main>*:nth-child(4){animation-delay:.12s}
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main>*{animation:none}}
.bhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.bhead .bill{width:118px;height:118px;border-radius:28px;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,rgba(var(--accent-rgb),.22),transparent 60%),radial-gradient(circle at 70% 80%,rgba(var(--primary-rgb),.18),transparent 60%),var(--card);
  border:1px solid var(--border);box-shadow:var(--shadow)}
.bhead .bill svg{width:92px;height:92px}
.ico{display:inline-block;vertical-align:middle}
.opt .oico{float:right;width:46px;height:46px;margin:-2px 22px 4px 8px}
.opt.sel .oico{filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}
.hero .art{position:relative;min-height:340px}
.hero .art .stage{position:absolute;inset:0;border-radius:24px;background:
  radial-gradient(closest-side at 55% 58%,rgba(var(--accent-rgb),.20),transparent),
  radial-gradient(closest-side at 30% 30%,rgba(var(--primary-rgb),.14),transparent)}
.hero .art svg.big{position:absolute}
.float{animation:flotar 6s ease-in-out infinite}
.float.d2{animation-delay:-2s} .float.d3{animation-delay:-4s}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.float{animation:none}}
.hero .art .mini{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);font-size:11.5px;color:var(--muted)}
.hero .art .mini b{display:block;font-size:17px;color:var(--primary-dark)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-sm)}
.stat .v{font-size:28px;font-weight:700;color:var(--primary-dark);line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.inc button .ib{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--primary-soft)}
.inc button .ib svg{width:40px;height:40px}
.empty{display:flex;gap:18px;align-items:center;background:var(--card);border:1px dashed var(--border-strong);border-radius:var(--r-lg);padding:18px 20px;margin:0 0 18px}
.empty svg{flex:none;width:84px;height:84px}
.empty p{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--r-pill);font-size:14.5px;box-shadow:var(--shadow-lg);transition:.3s var(--ease);z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.chart-wrap{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:20px;align-items:center}
.legend{display:grid;gap:6px;font-size:14px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.cmpbar{display:grid;grid-template-columns:130px minmax(0,1fr) 58px;gap:10px;align-items:center;font-size:13.5px;margin:5px 0}
.cmpbar .tr{position:relative;height:12px;background:var(--bg-soft);border-radius:6px}
.cmpbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--primary),color-mix(in srgb,var(--primary) 70%,var(--accent)))}
.cmpbar .tr i.hi{background:linear-gradient(90deg,var(--accent),#e4a64f)}
.cmpbar .tr b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.55}
.cmpbar .p{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.flag{display:inline-grid;place-items:center;min-width:28px;height:18px;padding:0 5px;border-radius:4px;font-size:10.5px;font-weight:800;letter-spacing:.06em;background:var(--primary);color:var(--on-primary);margin-right:6px;vertical-align:2px}
.doi{display:inline-flex;align-items:center;border-radius:6px;overflow:hidden;font-size:12px;font-weight:700;text-decoration:none;border:1px solid var(--border-strong)}
.doi span:first-child{background:#3b6aa0;color:#fff;padding:3px 7px}
.doi span:last-child{background:var(--card);color:var(--text);padding:3px 8px}
@media (max-width:900px){ .chart-wrap{grid-template-columns:minmax(0,1fr)} .hero .art{min-height:300px} }
@media (max-width:600px){ .bhead .bill{width:78px;height:78px;border-radius:20px} .bhead .bill svg{width:60px;height:60px} .langsw button{padding:4px 9px} .cmpbar{grid-template-columns:96px minmax(0,1fr) 48px} }

@media print{ .progress,.toast{display:none!important} .bhead .bill{box-shadow:none} }
/* ---- ayuda contextual «?» / context help ---- */
.qh{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:5px;border-radius:50%;font-size:11px;font-weight:700;line-height:1;font-style:normal;
  color:var(--primary);background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);cursor:help;vertical-align:1px;user-select:none;transition:.15s var(--ease)}
.qh:hover,.qh:focus-visible{background:var(--primary);color:var(--on-primary);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 25%,transparent)}
#qtip{position:fixed;z-index:120;background:var(--card);color:var(--text);border:1px solid var(--border-strong);border-radius:14px;padding:12px 14px 10px;box-shadow:var(--shadow-lg);
  font-size:13.5px;line-height:1.45;opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .15s,transform .15s;border-top:3px solid var(--accent)}
#qtip.on{opacity:1;transform:none}
#qtip .qt{display:block;font-size:14.5px;color:var(--primary-dark);margin-bottom:4px}
#qtip p{margin:0 0 8px}
#qtip .qe{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#qtip ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
#qtip li{position:relative;padding-left:16px}
#qtip li::before{content:"";position:absolute;left:2px;top:.5em;width:8px;height:8px;border-radius:50%;background:var(--info)}
#qtip li.ok::before{background:var(--ok)} #qtip li.warn::before{background:var(--warn)} #qtip li.bad::before{background:var(--bad)}
@media print{ .qh,#qtip{display:none!important} }

/* ---- vista productor / científico ---- */
html[data-modo="prod"] .sci, html[data-modo="cien"] .prod{display:none!important}
.modesw button{display:inline-flex;align-items:center;gap:6px}
.modesw svg{width:15px;height:15px;flex:none}

.consejo>svg{flex:none;width:36px;height:36px}

const CLAVE = 'ratioavis_v1';
let S = null;
function perfilPersonalInicial(){
  const g = GENETICAS.ross308;
  return g.fases.slice(0,3).map((f,i)=>({id:'p'+i, nombre:[FASE.ini,FASE.cre,FASE.fin][i], dias:['0–10 d','11–24 d',{es:'25 d – venta',en:'25 d – market'}][i], consumo:f.consumo, ganancia:f.ganancia, req:reqDesdeFase(g,f)}));
}
function estadoInicial(){
  return {
    version:1, bloque:'inicio',
    genetica:'ross308', sexo:'mixto', fase:0,
    req:null, consumo:null, ganancia:null, reqEditado:false,
    cond:{altitud:1500, temp:26, aves:10000, lote:1000, pigmentado:false, xanObj:70},
    ingredientes: ING_LIB.map(ingDesdeLib),
    sel: Object.fromEntries(ING_LIB.map(r=>[r[0], !!r[8]])),
    moneda:'$', proyecto:{nombre:'', autor:'', granja:''},
    personal: perfilPersonalInicial(),
    resultado:null, programa:null, evaluar:{}, visitados:{}, valCaso:'mx2020'
  };
}
function fasesDe(gk){ return gk==='personal' ? S.personal : GENETICAS[gk].fases; }
function reqBaseFase(s, gk, fi, sexo){
  const g = GENETICAS[gk];
  const f = (gk==='personal' ? s.personal : g.fases)[fi];
  const req = gk==='personal' ? JSON.parse(JSON.stringify(f.req)) : reqDesdeFase(g,f);
  const sx = SEXOS[sexo||'mixto'];
  if(gk!=='personal'){
    AA_KEYS.forEach(k=>{ if(req[k][0]!=null) req[k][0] = +(req[k][0]*sx.fAA).toFixed(3); });
    if(req.PC[0]!=null) req.PC[0] = +(req.PC[0]*sx.fPC).toFixed(2);
  }
  const nF = (gk==='personal'?s.personal:g.fases).length;
  if(s.cond.pigmentado && fi >= nF-2) req.Xan = [s.cond.xanObj,null];
  return {req, f};
}
function cargarRequerimientos(s){
  const lista = s.genetica==='personal' ? s.personal : GENETICAS[s.genetica].fases;
  if(s.fase >= lista.length) s.fase = 0;
  const {req,f} = reqBaseFase(s, s.genetica, s.fase, s.sexo);
  s.req = req; s.consumo = f.consumo; s.ganancia = f.ganancia; s.reqEditado = false; s.resultado = null;
}
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} actualizarPill(); }
function completarEstado(s){
  const base = estadoInicial();
  for(const k in base) if(s[k]===undefined) s[k]=base[k];
  for(const k in base.cond) if(s.cond[k]===undefined) s.cond[k]=base.cond[k];
  ING_LIB.forEach(r=>{ if(!s.ingredientes.find(i=>i.id===r[0])){ s.ingredientes.push(ingDesdeLib(r)); s.sel[r[0]]=false; } });
  NUTRIENTES.forEach(n=>{ if(!s.req[n.k]) s.req[n.k]=[null,null]; });
  if(!GENETICAS[s.genetica]) s.genetica='ross308';
  return s;
}
function cargar(){
  try{ const t = localStorage.getItem(CLAVE); if(t){ const s = JSON.parse(t); if(s && s.version===1 && s.req) return completarEstado(s); } }catch(e){}
  S = estadoInicial(); cargarRequerimientos(S); return S;
}

    s:[['ok',E('1.8–2.1 : 1.','1.8–2.1 : 1.')],['warn',E('Menos de 1.7 o más de 2.3: revisa fuentes de Ca y P.','Below 1.7 or above 2.3: review Ca and P sources.')]]},
  EMPC:{c:E('Relación energía : proteína (kcal de EM por cada 1 % de PC). Indica si la dieta favorece músculo o grasa.','Energy : protein ratio (kcal ME per 1 % CP). Shows whether the diet favours muscle or fat.'),

  MCLys:{c:E('Metionina + cistina como % de la lisina (proteína ideal).','Methionine + cystine as % of lysine (ideal protein).'), s:[['ok',E('74–78.','74–78.')],['warn',E('Menos de 73: limitante.','Below 73: limiting.')]]},
  ThrLys:{c:E('Treonina como % de la lisina (proteína ideal).','Threonine as % of lysine (ideal protein).'), s:[['ok',E('65–68.','65–68.')],['warn',E('Menos de 64: limitante.','Below 64: limiting.')]]},
  ValLys:{c:E('Valina como % de la lisina (proteína ideal).','Valine as % of lysine (ideal protein).'), s:[['ok',E('76–80.','76–80.')],['warn',E('Menos de 75: limitante.','Below 75: limiting.')]]},
  ArgLys:{c:E('Arginina como % de la lisina (proteína ideal).','Arginine as % of lysine (ideal protein).'), s:[['ok',E('105–110.','105–110.')],['warn',E('Menos de 104: limitante, sobre todo con calor.','Below 104: limiting, especially under heat.')]]},
  pellet:{c:E('Grasa total de la dieta y su efecto en la dureza y durabilidad del pellet.','Total dietary fat and its effect on pellet hardness and durability.'),
    s:[['ok',E('Menos de 7 %: buen pellet.','Below 7 %: good pellets.')],['warn',E('7 % o más: agrega la grasa después de peletizar.','7 % or more: add fat after pelleting.')]]},
  entrada:{c:E('Precio de entrada: el precio al que un ingrediente no usado empezaría a entrar a la fórmula (precio actual menos su costo reducido).','Entry price: the price at which an unused ingredient would start entering the formula (current price minus its reduced cost).'),
    s:[['ok',E('Si tu proveedor te lo ofrece a ese precio o menos, vuelve a formular.','If your supplier offers it at that price or lower, reformulate.')],['info',E('Úsalo para negociar compras.','Use it to negotiate purchases.')]]},
  limEf:{c:E('Efecto de mover un límite de inclusión 1 punto porcentual, en costo por tonelada.','Effect on cost per tonne of moving an inclusion limit by one percentage point.'),
    s:[['warn',E('Negativo: relajar ese límite abarata la dieta; confirma que el límite esté justificado.','Negative: relaxing that limit makes the diet cheaper; confirm the limit is justified.')],['info',E('Positivo: el límite obliga a usar un ingrediente caro.','Positive: the limit forces an expensive ingredient.')]]},
  evaluar:{c:E('Compara una fórmula que ya usas contra los requerimientos y contra la fórmula óptima.','Compares a formula you already use against the requirements and against the optimal formula.'),
    s:[['info',E('La diferencia por tonelada × toneladas al año = ahorro posible.','Difference per tonne × tonnes per year = possible savings.')]]},

  /* ---------- bloque 7 / block 7 ---------- */
  costoCiclo:{c:E('Costo total del alimento que consume cada ave de la primera a la última fase.','Total cost of the feed each bird eats from the first to the last phase.'),
    s:[['info',E('Suele ser 60–70 % del costo de producción del pollo.','Usually 60–70 % of broiler production cost.')]]},
  costoKgPV:{c:E('Costo de alimento por kg de peso vivo producido en el ciclo.','Feed cost per kg of live weight produced over the cycle.'),
    s:[['ok',E('Es el número que se compara contra el precio de venta del pollo.','It is the number to compare against the broiler sale price.')]]},
  promPond:{c:E('Costo por tonelada promedio del programa, ponderado por lo que se consume de cada fase.','Average cost per tonne of the program, weighted by how much of each phase is eaten.'),
    s:[['info',E('Las fases finales pesan más porque ahí se consume más alimento.','Later phases weigh more because most feed is eaten there.')]]},
  reparto:{c:E('Parte del gasto total de alimento que corresponde a cada fase.','Share of total feed spending that goes to each phase.'),
    s:[['ok',E('Concentra la negociación de precios en las fases que más pesan.','Focus price negotiation on the heaviest phases.')]]},

  /* ---------- validación / validation ---------- */
  mape:{c:E('Error absoluto medio porcentual (MAPE) entre el análisis calculado que publica cada artículo y el que calcula la app.','Mean absolute percentage error (MAPE) between the calculated analysis each paper reports and the one the app computes.'),
    s:[['ok',E('Menos de 3 %: concordancia excelente.','Below 3 %: excellent agreement.')],['info',E('3–8 %: aceptable; se explica por diferencias de matriz de ingredientes.','3–8 %: acceptable; explained by ingredient-matrix differences.')],['warn',E('Más de 10 %: revisar datos.','Above 10 %: check the data.')]]},

/* botón «?» / “?” button */
function ayuda(k){ return AYUDA[k] ? `<span class="qh" tabindex="0" role="button" data-q="${k}" aria-label="${T('Ayuda','Help')}">?</span>` : ''; }
function ayudaHTML(k, titulo){
  const a = AYUDA[k]; if(!a) return '';
  return `${titulo?`<b class="qt">${titulo}</b>`:''}<p>${tx(a.c)}</p><div class="qe">${T('Escala de decisión','Decision scale')}</div><ul>${a.s.map(([n,t])=>`<li class="${n}">${tx(t)}</li>`).join('')}</ul>`;
}
(function(){
  let tip=null, cur=null;
  function show(el){
    if(!tip){ tip=document.createElement('div'); tip.id='qtip'; tip.setAttribute('role','tooltip'); document.body.appendChild(tip); }
    const k=el.dataset.q; const tit = el.dataset.qt || (el.closest('td,th,label,h3,h4,.kpi .l,.l,.f')||{}).innerText || '';
    tip.innerHTML = ayudaHTML(k, (NUT[k]?tx(NUT[k].n):tit.replace(/\?/g,'').trim()).slice(0,90)); cur=el;
    tip.classList.add('on'); show.t=Date.now();
    const r=el.getBoundingClientRect(), w=Math.min(330, window.innerWidth-24); tip.style.width=w+'px';
    let x=r.left+r.width/2-w/2; x=Math.max(12,Math.min(x,window.innerWidth-w-12));
    const h=tip.offsetHeight; let y=r.bottom+8; if(y+h>window.innerHeight-8) y=Math.max(8,r.top-h-8);
    tip.style.left=x+'px'; tip.style.top=y+'px';
  }
  function hide(){ if(tip){ tip.classList.remove('on'); } cur=null; }
  document.addEventListener('mouseover',e=>{ const el=e.target.closest&&e.target.closest('.qh'); if(el) show(el); });
  document.addEventListener('mouseout',e=>{ const el=e.target.closest&&e.target.closest('.qh'); if(el && !(e.relatedTarget&&el.contains(e.relatedTarget))) hide(); });
  document.addEventListener('focusin',e=>{ const el=e.target.closest&&e.target.closest('.qh'); if(el) show(el); });
  document.addEventListener('focusout',e=>{ if(e.target.classList&&e.target.classList.contains('qh')) hide(); });
  document.addEventListener('click',e=>{ const el=e.target.closest&&e.target.closest('.qh'); if(el){ e.preventDefault(); e.stopPropagation(); show(el); } else hide(); }, true);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') hide(); });
  window.addEventListener('scroll',()=>{ if(cur && Date.now()-(show.t||0)>400) hide(); },{passive:true});
})();
</script>
<script>
"use strict";
/* =====================================================================
   5. MOTOR DE CÁLCULO
   ===================================================================== */
function deb(c){ return (c.Na||0)*10000/22.99 + (c.K||0)*10000/39.10 - (c.Cl||0)*10000/35.45; }
function valorNut(ing, k, base){
  if(k==='DEB') return deb(ing.comp);
  if(AA_KEYS.includes(k) && base==='dig') return ing.comp['d'+k]||0;
  return ing.comp[k]||0;
}
// Aporte de nutrientes de una fórmula {id: %}
function analizar(formula, base, ingredientes){
  const nutr = {}; let costo = 0, suma = 0;
  NUTRIENTES.forEach(n=>nutr[n.k]=0);
  for(const id in formula){
    const pct = +formula[id]||0; if(!pct) continue;
    const ing = ingredientes.find(i=>i.id===id); if(!ing) continue;
    suma += pct; costo += pct*(+ing.precio||0)/100;
    NUTRIENTES.forEach(n=>{ nutr[n.k] += pct*valorNut(ing,n.k,base)/100; });
  }
  return {nutr, costoKg:costo, suma};
}

/* Símplex en dos fases (minimización) con regla de Bland.
   filas: {a:[...], op:'>='|'<='|'=', b}. Devuelve {estado, x, z, duales, reducidos}. */
function simplex(c, filas){
  const n=c.length, m=filas.length, EPS=1e-9;
  const R_ = filas.map(f=>{
    let a=f.a.slice(), b=f.b, op=f.op, sg=1;
    if(b<0){ a=a.map(v=>-v); b=-b; op = op==='>='?'<=':(op==='<='?'>=':'='); sg=-1; }
    return {a,b,op,sg};
  });
  let nS=0,nA=0; const colH=[], colA=[];
  R_.forEach((r,i)=>{ colH[i] = r.op!=='=' ? n+(nS++) : -1; });
  R_.forEach((r,i)=>{ colA[i] = r.op!=='<=' ? -2 : -1; });
  R_.forEach((r,i)=>{ if(colA[i]===-2) colA[i] = n+nS+(nA++); });
  const N = n+nS+nA;
  const T = R_.map((r,i)=>{
    const row = new Float64Array(N+1);
    for(let j=0;j<n;j++) row[j]=r.a[j];
    if(colH[i]>=0) row[colH[i]] = r.op==='<=' ? 1 : -1;
    if(colA[i]>=0) row[colA[i]] = 1;
    row[N]=r.b; return row;
  });
  const basis = R_.map((r,i)=> r.op==='<=' ? colH[i] : colA[i]);
  const esArt = j => j>=n+nS;
  let PIV=0;
  function pivot(pr,pc){
    PIV++;
    const P=T[pr], p=P[pc];
    for(let j=0;j<=N;j++) P[j]/=p;
    for(let i=0;i<m;i++){ if(i===pr) continue; const f=T[i][pc]; if(Math.abs(f)>1e-12){ const Ti=T[i]; for(let j=0;j<=N;j++) Ti[j]-=f*P[j]; } }
    basis[pr]=pc;
  }
  function reducido(cost,j){ let d=cost[j]; for(let i=0;i<m;i++) d-=cost[basis[i]]*T[i][j]; return d; }
  function correr(cost, permitirArt){
    for(let it=0; it<50000; it++){
      const enB = new Set(basis); let ent=-1;
      for(let j=0;j<N;j++){ if(enB.has(j)) continue; if(!permitirArt && esArt(j)) continue; if(reducido(cost,j) < -EPS){ ent=j; break; } }
      if(ent<0) return 'optimo';
      let sal=-1, mejor=Infinity;
      for(let i=0;i<m;i++){ const a=T[i][ent]; if(a>EPS){ const q=T[i][N]/a; if(q<mejor-1e-12 || (Math.abs(q-mejor)<=1e-12 && basis[i]<basis[sal])){ mejor=q; sal=i; } } }
      if(sal<0) return 'no acotado';
      pivot(sal,ent);
    }
    return 'iteraciones';
  }
  const c1 = new Float64Array(N); for(let j=n+nS;j<N;j++) c1[j]=1;
  let st = correr(c1, true);
  let inf = 0; for(let i=0;i<m;i++) if(esArt(basis[i])) inf += T[i][N];
  if(inf > 1e-7) return {estado:'infactible'};
  for(let i=0;i<m;i++) if(esArt(basis[i])){ for(let j=0;j<n+nS;j++){ if(Math.abs(T[i][j])>1e-9){ pivot(i,j); break; } } }
  const c2 = new Float64Array(N); for(let j=0;j<n;j++) c2[j]=c[j];
  st = correr(c2, false);
  if(st!=='optimo') return {estado:st};
  const x = new Array(n).fill(0);
  for(let i=0;i<m;i++) if(basis[i]<n) x[basis[i]] = T[i][N];
  const z = x.reduce((s,v,j)=>s+v*c[j],0);
  const duales = R_.map((r,i)=>{
    let y;
    if(r.op==='<=') y = -reducido(c2,colH[i]);
    else if(r.op==='>=') y = reducido(c2,colH[i]);
    else y = -reducido(c2,colA[i]);
    return y*r.sg;
  });
  const reducidos = []; for(let j=0;j<n;j++) reducidos[j]=reducido(c2,j);
  return {estado:'optimo', x, z, duales, reducidos, piv:PIV};
}

/* Certificado de optimalidad por dualidad fuerte:
   si la solución es factible, los duales son factibles y ambos objetivos coinciden,
   la dieta es matemáticamente la de menor costo posible. */
function certificado(c, filas, x, y){
  let viol = 0;
  filas.forEach(f=>{ const l = f.a.reduce((s,v,j)=>s+v*x[j],0);
    if(f.op==='>=') viol = Math.max(viol, f.b-l); else if(f.op==='<=') viol = Math.max(viol, l-f.b); else viol = Math.max(viol, Math.abs(l-f.b)); });
  viol = Math.max(viol, ...x.map(v=>-v), 0);
  let dualViol = 0;
  filas.forEach((f,i)=>{ if(f.op==='>=') dualViol=Math.max(dualViol,-y[i]); if(f.op==='<=') dualViol=Math.max(dualViol,y[i]); });
  for(let j=0;j<c.length;j++){ let d=c[j]; filas.forEach((f,i)=>{ d-=y[i]*f.a[j]; }); dualViol=Math.max(dualViol,-d); }
  const zP = x.reduce((s,v,j)=>s+v*c[j],0), zD = filas.reduce((s,f,i)=>s+y[i]*f.b,0);
  const brecha = Math.abs(zP-zD)/Math.max(1,Math.abs(zP));
  return {viol, dualViol, brecha, ok: viol<1e-6 && dualViol<1e-6 && brecha<1e-7};
}

// Modelo de programación lineal a partir de: ingredientes seleccionados, requerimientos y base
function construirModelo(ings, req, base, omitir){
  const filas = [];
  const add = (tag, etiqueta, a, op, b, meta)=>{
    if(omitir && omitir===tag) return;
    const e = Math.max(1e-9, ...a.map(Math.abs));
    filas.push({tag, etiqueta, a:a.map(v=>v/e), op, b:b/e, esc:e, ...meta});
  };
  add('suma',T('Suma de ingredientes = 100 %','Sum of ingredients = 100 %'), ings.map(()=>1), '=', 100, {tipo:'suma'});
  NUTRIENTES.forEach(nu=>{
    const r = req[nu.k]; if(!r) return;
    const a = ings.map(i=>valorNut(i,nu.k,base));
    if(r[0]!=null && r[0]!=='') add('nmin_'+nu.k, tx(nu.n)+' ≥ '+r[0], a, '>=', 100*r[0], {tipo:'nut', k:nu.k, lado:'min', req:r[0]});
    if(r[1]!=null && r[1]!=='') add('nmax_'+nu.k, tx(nu.n)+' ≤ '+r[1], a, '<=', 100*r[1], {tipo:'nut', k:nu.k, lado:'max', req:r[1]});
  });
  ings.forEach((ing,j)=>{
    const e = ings.map((_,q)=>q===j?1:0);
    if(ing.min>0) add('imin_'+ing.id, tx(ing.nombre)+' ≥ '+ing.min+' %', e, '>=', ing.min, {tipo:'ing', id:ing.id, lado:'min'});
    if(ing.max!=null && ing.max!=='' && ing.max<100) add('imax_'+ing.id, tx(ing.nombre)+' ≤ '+ing.max+' %', e, '<=', ing.max, {tipo:'ing', id:ing.id, lado:'max'});
  });
  return {ings, filas, c:ings.map(i=>+i.precio||0), base, req};
}
function resolverModelo(M){
  if(!M.ings.length) return {ok:false, motivo:T('No hay ingredientes seleccionados.','No ingredients selected.')};
  const sol = simplex(M.c, M.filas);
  if(sol.estado!=='optimo'){
    return {ok:false, motivo: sol.estado==='infactible' ? T('No existe ninguna combinación de los ingredientes seleccionados que cumpla todas las restricciones.','No combination of the selected ingredients meets all the constraints.') : T('El cálculo no convergió (','The calculation did not converge (')+sol.estado+').',
      diagnostico: sol.estado==='infactible' ? diagnosticar(M) : null};
  }
  const pct = sol.x.map(v=> Math.abs(v)<1e-7 ? 0 : v);
  const nutr = {};
  NUTRIENTES.forEach(nu=>{ nutr[nu.k] = M.ings.reduce((acc,ing,j)=>acc+pct[j]*valorNut(ing,nu.k,M.base),0)/100; });
  const restr = M.filas.map((f,i)=>{
    const lhs = f.a.reduce((acc,v,j)=>acc+v*pct[j],0);
    const activa = Math.abs(lhs - f.b) < 1e-6*Math.max(1,Math.abs(f.b));
    return {tag:f.tag, etiqueta:f.etiqueta, tipo:f.tipo, k:f.k, id:f.id, lado:f.lado, req:f.req, activa, dual: sol.duales[i]/f.esc};
  });
  return { ok:true, fecha:new Date().toISOString(), base:M.base,
    formula: M.ings.map((ing,j)=>({id:ing.id, nombre:ing.nombre, cat:ing.cat, pct:pct[j], precio:+ing.precio, reducido: sol.reducidos[j]})),
    costoKg: sol.z/100, nutr, restr, cert: certificado(M.c, M.filas, sol.x, sol.duales),
    modelo: {n:M.ings.length, m:M.filas.length, piv:sol.piv} };
}
function diagnosticar(M){
  const culpables = [];
  const tags = [...new Set(M.filas.map(f=>f.tag))].filter(t=>t!=='suma');
  tags.forEach(t=>{
    const M2 = construirModelo(M.ings, M.req, M.base, t);
    if(simplex(M2.c, M2.filas).estado==='optimo') culpables.push(M.filas.find(f=>f.tag===t).etiqueta);
  });
  const sinFuente = [];
  NUTRIENTES.forEach(nu=>{ const r = M.req[nu.k]; if(!r || r[0]==null || r[0]<=0) return;
    if(!M.ings.some(i=>valorNut(i,nu.k,M.base)>0)) sinFuente.push(tx(nu.n)); });
  return {culpables, sinFuente};
}
function formular(s){
  const ings = s.ingredientes.filter(i=>s.sel[i.id]);
  const M = construirModelo(ings, s.req, GENETICAS[s.genetica].base);
  const r = resolverModelo(M);
  r.contexto = {genetica:s.genetica, sexo:s.sexo, fase:s.fase, req:JSON.parse(JSON.stringify(s.req)), consumo:s.consumo, ganancia:s.ganancia};
  return r;
}
// Programa completo: formula todas las fases de la línea seleccionada
function formularPrograma(s){
  const lista = fasesDe(s.genetica), base = GENETICAS[s.genetica].base;
  const ings = s.ingredientes.filter(i=>s.sel[i.id]);
  const fases = lista.map((f,i)=>{
    const {req} = reqBaseFase(s, s.genetica, i, s.sexo);
    if(s.cond.temp>=30) req.DEB = [230,300];
    const r = resolverModelo(construirModelo(ings, req, base));
    return {nombre:f.nombre, dias:f.dias, consumo:f.consumo, ganancia:f.ganancia, req, r};
  });
  return {fecha:new Date().toISOString(), genetica:s.genetica, sexo:s.sexo, base, fases};
}
